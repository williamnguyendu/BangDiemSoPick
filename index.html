                        ${st.points}
                      </td>
                      <td class="py-2 px-2 text-center align-middle font-bold text-sm whitespace-nowrap ${st.diff > 0 ? 'text-emerald-700' : (st.diff < 0 ? 'text-rose-600' : 'text-slate-600')}">
                        ${st.diff > 0 ? '+' : ''}${st.diff}
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      ` : '';

      const finishedMatches = groupMatches
        .filter(m => (m.TrangThai || '').trim() === 'Đã thi đấu')
        .sort((a, b) => {
          const endA = parseVNDateTime(a.ThoiGianKetThuc) || parseVNDateTime(a.NgayGioThiDau);
          const endB = parseVNDateTime(b.ThoiGianKetThuc) || parseVNDateTime(b.NgayGioThiDau);
          if (endB !== endA) return endB - endA;
          return parseLuotNumber(b.LuotTran) - parseLuotNumber(a.LuotTran);
        });

      const statusPriority = { 'Đang thi đấu': 1, 'Chuẩn bị thi đấu': 2, 'Chờ thi đấu': 3 };
      const upcomingMatches = groupMatches
        .filter(m => (m.TrangThai || '').trim() !== 'Đã thi đấu')
        .sort((a, b) => {
          const pA = statusPriority[(a.TrangThai || '').trim()] || 9;
          const pB = statusPriority[(b.TrangThai || '').trim()] || 9;
          if (pA !== pB) return pA - pB;
          const luotDiff = parseLuotNumber(a.LuotTran) - parseLuotNumber(b.LuotTran);
          if (luotDiff !== 0) return luotDiff;
          return parseVNDateTime(a.NgayGioThiDau) - parseVNDateTime(b.NgayGioThiDau);
        });

      container.innerHTML = `
        <div class="h-full grid grid-cols-1 lg:grid-cols-12 gap-4">
          <!-- BÊN TRÁI (6/12): CÁC BẢNG THI ĐẤU & XẾP HẠNG HẠNG 3 -->
          <div class="lg:col-span-6 h-full overflow-y-auto pr-1">
            <div class="grid ${gridColsClass} gap-4">
              ${groupsHtml || '<div class="text-slate-500 text-center py-10">Chưa có dữ liệu bảng đấu</div>'}
            </div>
            ${thirdPlaceHtml}
          </div>

          <!-- BÊN PHẢI (6/12): NỬA TRÊN LỊCH & SÂN ĐANG/SẮP ĐẤU - NỬA DƯỚI KẾT QUẢ ĐÃ THI ĐẤU -->
          <div class="lg:col-span-6 h-full flex flex-col gap-4 overflow-hidden">
            <!-- Nửa trên -->
            <div class="flex-1 bg-slate-100/80 rounded-2xl border border-slate-300 p-3 flex flex-col overflow-hidden">
              <div class="flex items-center justify-between mb-2 px-1 shrink-0">
                <h3 class="font-black text-emerald-900 uppercase text-sm md:text-base flex items-center gap-2">
                  <i class="fa-solid fa-fire text-amber-500"></i> Lịch & Sân đang/sắp đấu (${upcomingMatches.length})
                </h3>
                <div class="flex items-center gap-1.5 text-[11px] font-bold">
                  <span class="px-2 py-0.5 rounded bg-emerald-200 text-emerald-900">Đang đấu</span>
                  <span class="px-2 py-0.5 rounded bg-amber-200 text-amber-900">Chuẩn bị</span>
                  <span class="px-2 py-0.5 rounded bg-slate-200 text-slate-700">Chờ đấu</span>
                </div>
              </div>
              <div class="flex-1 overflow-y-auto space-y-2.5 pr-1">
                ${upcomingMatches.length
                  ? upcomingMatches.map(m => renderMatchCard(m, teamsMap, false, true)).join('')
                  : '<div class="text-center text-slate-400 py-8 font-medium">Không còn trận chờ thi đấu</div>'}
              </div>
            </div>

            <!-- Nửa dưới -->
            <div class="flex-1 bg-slate-100/80 rounded-2xl border border-slate-300 p-3 flex flex-col overflow-hidden">
              <div class="flex items-center justify-between mb-2 px-1 shrink-0">
                <h3 class="font-black text-sky-900 uppercase text-sm md:text-base flex items-center gap-2">
                  <i class="fa-solid fa-flag-checkered text-sky-600"></i> Kết quả đã thi đấu (${finishedMatches.length})
                </h3>
                <span class="text-xs text-slate-500 font-semibold">Mới nhất lên đầu</span>
              </div>
              <div class="flex-1 overflow-y-auto space-y-2.5 pr-1">
                ${finishedMatches.length
                  ? finishedMatches.map(m => renderMatchCard(m, teamsMap, false, true)).join('')
                  : '<div class="text-center text-slate-400 py-8 font-medium">Chưa có trận nào hoàn thành</div>'}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 2: CÁC VÒNG LOẠI TRỰC TIẾP (TỨ KẾT, BÁN KẾT, SERI B - CHIA 3 CỘT ĐỀU)
    // =========================================================================
    function renderKnockoutRoundView(container, roundName) {
      const teamsMap = getTeamsMap();
      const roundMatches = (tournamentData.matches || []).filter(m => m.Vong === roundName);

      const waitPriority = { 'Chuẩn bị thi đấu': 1, 'Chờ thi đấu': 2 };
      const waitingMatches = roundMatches
        .filter(m => ['Chuẩn bị thi đấu', 'Chờ thi đấu'].includes((m.TrangThai || '').trim()))
        .sort((a, b) => {
          const pA = waitPriority[(a.TrangThai || '').trim()] || 9;
          const pB = waitPriority[(b.TrangThai || '').trim()] || 9;
          if (pA !== pB) return pA - pB;
          const luotDiff = parseLuotNumber(a.LuotTran) - parseLuotNumber(b.LuotTran);
          if (luotDiff !== 0) return luotDiff;
          return parseVNDateTime(a.NgayGioThiDau) - parseVNDateTime(b.NgayGioThiDau);
        });

      const liveMatches = roundMatches
        .filter(m => (m.TrangThai || '').trim() === 'Đang thi đấu')
        .sort((a, b) => {
          const luotDiff = parseLuotNumber(a.LuotTran) - parseLuotNumber(b.LuotTran);
          if (luotDiff !== 0) return luotDiff;
          return parseVNDateTime(a.NgayGioThiDau) - parseVNDateTime(b.NgayGioThiDau);
        });

      const finishedMatches = roundMatches
        .filter(m => (m.TrangThai || '').trim() === 'Đã thi đấu')
        .sort((a, b) => {
          const endA = parseVNDateTime(a.ThoiGianKetThuc) || parseVNDateTime(a.NgayGioThiDau);
          const endB = parseVNDateTime(b.ThoiGianKetThuc) || parseVNDateTime(b.NgayGioThiDau);
          if (endB !== endA) return endB - endA;
          return parseLuotNumber(b.LuotTran) - parseLuotNumber(a.LuotTran);
        });

      container.innerHTML = `
        <div class="h-full grid grid-cols-1 lg:grid-cols-3 gap-4">
          <!-- CỘT 1: CHỜ THI ĐẤU & CHUẨN BỊ THI ĐẤU -->
          <div class="h-full bg-amber-50/40 rounded-2xl border border-amber-200 p-3.5 flex flex-col overflow-hidden">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-amber-200 shrink-0">
              <h2 class="text-base md:text-lg font-black text-amber-950 uppercase flex items-center gap-2">
                <i class="fa-regular fa-clock text-amber-600"></i> Chờ & Chuẩn bị (${waitingMatches.length})
              </h2>
              <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-amber-200 text-amber-900">Chuẩn bị ưu tiên</span>
            </div>
            <div class="flex-1 overflow-y-auto space-y-3 pr-1">
              ${waitingMatches.length
                ? waitingMatches.map(m => renderMatchCard(m, teamsMap, false, false)).join('')
                : '<div class="text-center text-slate-400 py-12 font-medium">Không có trận chờ hoặc chuẩn bị thi đấu</div>'}
            </div>
          </div>

          <!-- CỘT 2: ĐANG THI ĐẤU -->
          <div class="h-full bg-emerald-50/70 rounded-2xl border-2 border-emerald-300 p-3.5 flex flex-col overflow-hidden">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-emerald-200 shrink-0">
              <h2 class="text-base md:text-lg font-black text-emerald-950 uppercase flex items-center gap-2">
                <i class="fa-solid fa-bolt text-emerald-600"></i> Đang thi đấu (${liveMatches.length})
              </h2>
              <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-emerald-600 text-white">LIVE</span>
            </div>
            <div class="flex-1 overflow-y-auto space-y-3 pr-1">
              ${liveMatches.length
                ? liveMatches.map(m => renderMatchCard(m, teamsMap, false, false)).join('')
                : '<div class="text-center text-slate-500 py-12 font-medium">Hiện không có trận nào đang thi đấu</div>'}
            </div>
          </div>

          <!-- CỘT 3: ĐÃ THI ĐẤU -->
          <div class="h-full bg-slate-100/80 rounded-2xl border border-slate-300 p-3.5 flex flex-col overflow-hidden">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-300 shrink-0">
              <h2 class="text-base md:text-lg font-black text-sky-900 uppercase flex items-center gap-2">
                <i class="fa-solid fa-flag-checkered text-sky-600"></i> Đã thi đấu (${finishedMatches.length})
              </h2>
              <span class="text-xs text-slate-500 font-semibold">Mới nhất lên đầu</span>
            </div>
            <div class="flex-1 overflow-y-auto space-y-3 pr-1">
              ${finishedMatches.length
                ? finishedMatches.map(m => renderMatchCard(m, teamsMap, false, false)).join('')
                : '<div class="text-center text-slate-400 py-12 font-medium">Chưa có trận nào hoàn thành</div>'}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 3: VÒNG CHUNG KẾT
    // =========================================================================
    function renderFinalRoundView(container, roundName) {
      const teamsMap = getTeamsMap();
      const finalMatches = (tournamentData.matches || []).filter(m => m.Vong === roundName);

      container.innerHTML = `
        <div class="h-full flex flex-col items-center justify-center bg-gradient-to-br from-sky-900 via-slate-900 to-emerald-950 rounded-3xl p-6 md:p-10 shadow-2xl border-4 border-amber-400/70 overflow-y-auto">
          <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 bg-amber-400 text-slate-950 px-6 py-2 rounded-full font-black uppercase tracking-widest text-sm md:text-base shadow-lg mb-3">
              <i class="fa-solid fa-crown"></i> Trận Đấu Tranh Ngôi Vô Địch
            </div>
            <h2 class="text-4xl md:text-6xl font-black text-white uppercase tracking-tight drop-shadow">
              ${roundName}
            </h2>
          </div>

          <div class="w-full max-w-5xl space-y-6">
            ${finalMatches.length
              ? finalMatches.map(m => renderMatchCard(m, teamsMap, true, false)).join('')
              : '<div class="text-center text-white/70 text-2xl py-10">Chưa cập nhật cặp đấu Chung kết</div>'}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 4: TRANG SƠ ĐỒ (MAP CHÍNH XÁC MÃ TRẬN TK1, TK2... VỚI GHI CHÚ BÁN KẾT)
    // =========================================================================
    function renderBracketDiagramView(container) {
      const matches = tournamentData.matches || [];
      const teamsMap = getTeamsMap();

      if (matches.length === 0) {
        container.innerHTML = `
          <div class="h-full flex items-center justify-center bg-white rounded-2xl border border-slate-200 text-slate-400 text-2xl font-bold">
            Chưa có dữ liệu trận đấu để hiển thị sơ đồ
          </div>`;
        return;
      }

      const sortMatchesForBracket = (arr) => {
        return [...arr].sort((a, b) => {
          const numA = parseLuotNumber(a.MaTran);
          const numB = parseLuotNumber(b.MaTran);
          if (numA !== numB && numA > 0 && numB > 0) return numA - numB;
          const luotDiff = parseLuotNumber(a.LuotTran) - parseLuotNumber(b.LuotTran);
          if (luotDiff !== 0) return luotDiff;
          const tA = parseVNDateTime(a.NgayGioThiDau);
          const tB = parseVNDateTime(b.NgayGioThiDau);
          if (tA !== tB) {
            if (tA === 0) return 1;
            if (tB === 0) return -1;
            return tA - tB;
          }
          return (a.MaTran || '').localeCompare(b.MaTran || '');
        });
      };

      const alignTrackStages = (stages) => {
        if (stages.length <= 1) return stages;
        const aligned = stages.map(s => ({ ...s, matches: [...s.matches] }));

        for (let i = aligned.length - 2; i >= 0; i--) {
          const leftMatches = aligned[i].matches;
          const rightMatches = aligned[i + 1].matches;
          const ordered = [];
          const usedIndices = new Set();

          rightMatches.forEach(dstMatch => {
            const idx1 = findSourceMatchIndex(dstMatch.GhiChu1, dstMatch.MaDoiThu1, leftMatches);
            if (idx1 !== -1 && !usedIndices.has(idx1)) {
              usedIndices.add(idx1);
              ordered.push(leftMatches[idx1]);
            }
            const idx2 = findSourceMatchIndex(dstMatch.GhiChu2, dstMatch.MaDoiThu2, leftMatches);
            if (idx2 !== -1 && !usedIndices.has(idx2)) {
              usedIndices.add(idx2);
              ordered.push(leftMatches[idx2]);
            }
          });

          leftMatches.forEach((m, idx) => {
            if (!usedIndices.has(idx)) {
              ordered.push(m);
            }
          });

          aligned[i].matches = ordered;
        }

        return aligned;
      };

      const groupMatches = matches
        .filter(m => (m.Vong || '').trim().toLowerCase() === 'vòng bảng')
        .sort((a, b) => {
          const gA = (teamsMap[a.MaDoiThu1]?.BangThiDau || teamsMap[a.MaDoiThu2]?.BangThiDau || 'Z');
          const gB = (teamsMap[b.MaDoiThu1]?.BangThiDau || teamsMap[b.MaDoiThu2]?.BangThiDau || 'Z');
          if (gA !== gB) return gA.localeCompare(gB);
          const luotDiff = parseLuotNumber(a.LuotTran) - parseLuotNumber(b.LuotTran);
          if (luotDiff !== 0) return luotDiff;
          return parseVNDateTime(a.NgayGioThiDau) - parseVNDateTime(b.NgayGioThiDau);
        });

      const mainStageNames = ['Tứ kết', 'Bán kết', 'Chung kết'];
      const mainStages = mainStageNames
        .map(name => ({
          name,
          matches: sortMatchesForBracket(matches.filter(m => (m.Vong || '').trim().toLowerCase() === name.toLowerCase()))
        }))
        .filter(s => s.matches.length > 0);

      const knownLower = new Set([
        'vòng bảng',
        'tứ kết', 'bán kết', 'chung kết',
        'tứ kết seri b', 'bán kết seri b', 'chung kết seri b'
      ]);
      const extraStages = [...new Set(matches.map(m => (m.Vong || '').trim()).filter(v => v && !knownLower.has(v.toLowerCase())))]
        .map(name => ({
          name,
          matches: sortMatchesForBracket(matches.filter(m => (m.Vong || '').trim() === name))
        }));
      const allMainStages = alignTrackStages([...extraStages, ...mainStages]);

      const seriBStageNames = ['Tứ kết Seri B', 'Bán kết Seri B', 'Chung kết Seri B'];
      const seriBStages = alignTrackStages(
        seriBStageNames
          .map(name => ({
            name,
            matches: sortMatchesForBracket(matches.filter(m => (m.Vong || '').trim().toLowerCase() === name.toLowerCase()))
          }))
          .filter(s => s.matches.length > 0)
      );

      const renderConnectorSvg = (leftMatches, rightMatches, strokeColor = '#10b981') => {
        const leftCount = leftMatches.length;
        const rightCount = rightMatches.length;
        if (leftCount <= 0 || rightCount <= 0) return '';

        const edges = [];
        rightMatches.forEach((dstMatch, dstIdx) => {
          const s1 = findSourceMatchIndex(dstMatch.GhiChu1, dstMatch.MaDoiThu1, leftMatches);
          const s2 = findSourceMatchIndex(dstMatch.GhiChu2, dstMatch.MaDoiThu2, leftMatches);

          if (s1 !== -1 || s2 !== -1) {
            if (s1 !== -1) edges.push({ srcIdx: s1, dstIdx, slot: 1 });
            if (s2 !== -1 && s2 !== s1) edges.push({ srcIdx: s2, dstIdx, slot: 2 });
          } else if (leftCount === rightCount * 2) {
            edges.push({ srcIdx: 2 * dstIdx, dstIdx, slot: 1 });
            edges.push({ srcIdx: 2 * dstIdx + 1, dstIdx, slot: 2 });
          }
        });

        let paths = '';
        if (edges.length > 0) {
          edges.forEach((edge, idx) => {
            const yLeft = ((2 * edge.srcIdx + 1) / (2 * leftCount)) * 100;
            const yRightCenter = ((2 * edge.dstIdx + 1) / (2 * rightCount)) * 100;
            const peers = edges.filter(e => e.dstIdx === edge.dstIdx);
            let yRight = yRightCenter;
            if (peers.length > 1) {
              const offset = Math.min(4, 14 / rightCount);
              yRight = edge.slot === 1 ? yRightCenter - offset : yRightCenter + offset;
            }
            const midX = 35 + ((idx % 4) * 10);
            paths += `
              <path d="M 0 ${yLeft} H ${midX} V ${yRight} H 100"
                    fill="none" stroke="${strokeColor}" stroke-width="2.5" vector-effect="non-scaling-stroke" />
              <circle cx="100" cy="${yRight}" r="3" fill="${strokeColor}" />
            `;
          });
        } else {
          for (let i = 0; i < leftCount; i++) {
            const yL = ((2 * i + 1) / (2 * leftCount)) * 100;
            paths += `<path d="M 0 ${yL} H 45 V 50" fill="none" stroke="${strokeColor}" stroke-width="2" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" />`;
          }
          for (let j = 0; j < rightCount; j++) {
            const yR = ((2 * j + 1) / (2 * rightCount)) * 100;
            paths += `<path d="M 45 50 H 55 V ${yR} H 100" fill="none" stroke="${strokeColor}" stroke-width="2.5" vector-effect="non-scaling-stroke" />`;
          }
        }

        return `
          <div class="w-11 shrink-0 flex flex-col pt-11 pb-2">
            <svg class="w-full flex-1 overflow-visible" viewBox="0 0 100 100" preserveAspectRatio="none">
              ${paths}
            </svg>
          </div>
        `;
      };

      const renderKnockoutTrack = (stages, trackTitle, theme = 'main') => {
        if (!stages.length) return '';
        const isSeriB = theme === 'serib';
        const headerBg = isSeriB
          ? 'from-indigo-700 to-sky-700 border-indigo-400'
          : 'from-sky-800 to-emerald-700 border-emerald-400';
        const strokeColor = isSeriB ? '#6366f1' : '#10b981';

        const colsHtml = stages.map((stage, idx) => {
          const isFinal = stage.name.toLowerCase().includes('chung kết');
          const stageHeaderClass = isFinal
            ? 'bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 text-slate-950 border-amber-300'
            : `bg-gradient-to-r ${headerBg} text-white`;

          const colHtml = `
            <div class="w-[380px] xl:w-[410px] shrink-0 h-full flex flex-col">
              <div class="${stageHeaderClass} px-3.5 py-2 rounded-xl shadow border flex items-center justify-between mb-2 shrink-0">
                <span class="font-black uppercase text-sm tracking-wide flex items-center gap-1.5">
                  ${isFinal ? '<i class="fa-solid fa-crown"></i>' : '<i class="fa-solid fa-sitemap"></i>'}
                  ${stage.name}
                </span>
                <span class="text-xs font-extrabold px-2 py-0.5 rounded-full ${isFinal ? 'bg-slate-950/15 text-slate-950' : 'bg-white/20 text-white'}">
                  ${stage.matches.length} trận
                </span>
              </div>

              <div class="flex-1 overflow-y-auto flex flex-col justify-around gap-2.5 pr-1 py-1">
                ${stage.matches.map(m => renderMatchCard(m, teamsMap, false, false)).join('')}
              </div>
            </div>
          `;

          const nextStage = stages[idx + 1];
          const connectorHtml = nextStage
            ? renderConnectorSvg(stage.matches, nextStage.matches, strokeColor)
            : '';

          return colHtml + connectorHtml;
        }).join('');

        return `
          <div class="flex-1 min-h-0 flex flex-col bg-white/70 rounded-2xl border ${isSeriB ? 'border-indigo-200' : 'border-emerald-200'} p-2.5 shadow-sm">
            ${trackTitle ? `
              <div class="mb-2 px-2 flex items-center gap-2 shrink-0">
                <span class="px-2.5 py-0.5 rounded-md text-xs font-black uppercase tracking-wider ${isSeriB ? 'bg-indigo-100 text-indigo-800 border border-indigo-200' : 'bg-emerald-100 text-emerald-800 border border-emerald-200'}">
                  ${trackTitle}
                </span>
                <div class="h-px flex-1 ${isSeriB ? 'bg-indigo-200' : 'bg-emerald-200'}"></div>
              </div>
            ` : ''}
            <div class="flex-1 min-h-0 flex items-stretch">
              ${colsHtml}
            </div>
          </div>
        `;
      };

      let groupColHtml = '';
      if (groupMatches.length > 0) {
        const byGroup = {};
        groupMatches.forEach(m => {
          const g = (teamsMap[m.MaDoiThu1]?.BangThiDau || teamsMap[m.MaDoiThu2]?.BangThiDau || 'Chung');
          if (!byGroup[g]) byGroup[g] = [];
          byGroup[g].push(m);
        });

        const groupBlocksHtml = Object.keys(byGroup).sort((a, b) => a.localeCompare(b)).map(gName => `
          <div class="space-y-2">
            <div class="sticky top-0 z-10 bg-sky-100/95 backdrop-blur-sm border border-sky-300 text-sky-900 px-3 py-1 rounded-lg text-xs font-black uppercase tracking-wider flex items-center justify-between shadow-sm">
              <span><i class="fa-solid fa-layer-group mr-1.5 text-sky-700"></i>Bảng ${gName}</span>
              <span>${byGroup[gName].length} trận</span>
            </div>
            ${byGroup[gName].map(m => renderMatchCard(m, teamsMap, false, true)).join('')}
          </div>
        `).join('');

        groupColHtml = `
          <div class="w-[390px] xl:w-[420px] shrink-0 h-full bg-white/80 rounded-2xl border border-sky-200 p-2.5 shadow-sm flex flex-col">
            <div class="bg-gradient-to-r from-sky-700 to-cyan-600 text-white px-3.5 py-2 rounded-xl shadow flex items-center justify-between mb-2 shrink-0">
              <span class="font-black uppercase text-sm tracking-wide flex items-center gap-1.5">
                <i class="fa-solid fa-table-cells"></i> Vòng bảng
              </span>
              <span class="text-xs font-extrabold bg-white/20 px-2 py-0.5 rounded-full">
                ${groupMatches.length} trận
              </span>
            </div>
            <div class="flex-1 overflow-y-auto space-y-3 pr-1">
              ${groupBlocksHtml}
            </div>
          </div>

          ${(allMainStages.length > 0 || seriBStages.length > 0) ? `
            <div class="w-12 shrink-0 flex flex-col items-center justify-center gap-2 text-emerald-600">
              <div class="w-0.5 flex-1 bg-gradient-to-b from-transparent via-emerald-400 to-emerald-500"></div>
              <div class="w-9 h-9 rounded-full bg-emerald-600 text-white shadow-md flex items-center justify-center text-sm">
                <i class="fa-solid fa-angles-right"></i>
              </div>
              <div class="w-0.5 flex-1 bg-gradient-to-t from-transparent via-emerald-400 to-emerald-500"></div>
            </div>
          ` : ''}
        `;
      }

      const hasBothTracks = allMainStages.length > 0 && seriBStages.length > 0;

      container.innerHTML = `
        <div class="h-full w-full bg-gradient-to-br from-slate-100 via-sky-50/60 to-emerald-50/60 rounded-2xl border border-slate-300 p-3 flex flex-col overflow-hidden">
          <div class="flex items-center justify-between mb-2 px-1 shrink-0">
            <div class="flex items-center gap-2 text-xs md:text-sm font-black text-slate-800 uppercase">
              <i class="fa-solid fa-diagram-project text-emerald-600"></i>
              <span>Sơ đồ lộ trình giải đấu</span>
            </div>
            <div class="flex items-center gap-3 text-xs font-semibold text-slate-500">
              <span><i class="fa-solid fa-arrows-left-right text-sky-600 mr-1"></i>Kéo sang ngang để xem toàn bộ các vòng</span>
            </div>
          </div>

          <div id="bracket-scroll-wrapper" class="flex-1 min-h-0 w-full overflow-x-auto overflow-y-hidden pb-1">
            <div class="h-full inline-flex items-stretch min-w-full">
              ${groupColHtml}

              ${(allMainStages.length > 0 || seriBStages.length > 0) ? `
                <div class="h-full flex flex-col justify-between gap-3">
                  ${renderKnockoutTrack(allMainStages, hasBothTracks ? 'Nhánh Vô Địch (Seri A)' : '', 'main')}
                  ${renderKnockoutTrack(seriBStages, 'Nhánh Seri B', 'serib')}
                </div>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 5: BỤC VINH QUANG THÀNH TÍCH
    // =========================================================================
    function renderAchievementsView(container) {
      const teams = tournamentData.teams || [];

      const renderPodiumBlock = (title, champList, runnerUpList, thirdList, isSeriB = false) => {
        const hasAny = champList.length || runnerUpList.length || thirdList.length;
        if (!hasAny) return '';

        const renderTeamPodiumCard = (team, rankType) => {
          const p1 = team.VDV1 || {};
          const p2 = team.VDV2 || {};
          const name1 = getPlayerDisplayName(p1);
          const name2 = getPlayerDisplayName(p2);
          const defaultAvatar = 'https://cdn-icons-png.flaticon.com/512/166/166344.png';

          let cardStyle = 'bg-white border-2 border-slate-200 shadow-lg';
          let ribbon = '';
          let imgSize = 'w-24 h-24 md:w-28 md:h-28';
          let nameSize = 'text-base md:text-lg';

          if (rankType === 'CHAMP') {
            cardStyle = 'champion-card shadow-2xl';
            ribbon = `<div class="bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 text-slate-950 font-black px-5 py-1.5 rounded-full text-sm md:text-base uppercase tracking-wider shadow inline-flex items-center gap-2 mb-4"><i class="fa-solid fa-trophy"></i> ${isSeriB ? 'Vô Địch Seri B' : 'Vô Địch'}</div>`;
            imgSize = 'w-28 h-28 md:w-36 md:h-36';
            nameSize = 'text-lg md:text-2xl';
          } else if (rankType === 'SECOND') {
            cardStyle = 'bg-gradient-to-b from-slate-100 to-slate-200 border-2 border-slate-400 shadow-xl';
            ribbon = `<div class="bg-slate-600 text-white font-extrabold px-4 py-1 rounded-full text-xs md:text-sm uppercase tracking-wider shadow inline-flex items-center gap-1.5 mb-3"><i class="fa-solid fa-medal text-slate-200"></i> ${isSeriB ? 'Á Quân Seri B' : 'Á Quân'}</div>`;
          } else {
            cardStyle = 'bg-gradient-to-b from-orange-50 to-amber-100/70 border-2 border-amber-600/40 shadow-lg';
            ribbon = `<div class="bg-amber-700 text-white font-extrabold px-4 py-1 rounded-full text-xs md:text-sm uppercase tracking-wider shadow inline-flex items-center gap-1.5 mb-3"><i class="fa-solid fa-award text-amber-200"></i> ${isSeriB ? 'Hạng Ba Seri B' : 'Hạng Ba'}</div>`;
          }

          return `
            <div class="${cardStyle} rounded-3xl p-5 flex flex-col items-center text-center transition-all">
              ${ribbon}
              <div class="grid ${name2 ? 'grid-cols-2' : 'grid-cols-1'} gap-4 w-full items-start justify-items-center mb-3">
                <div class="flex flex-col items-center w-full min-w-0">
                  <img src="${p1.HinhAnhDaiDien || defaultAvatar}" onerror="this.src='${defaultAvatar}'"
                       class="${imgSize} rounded-full object-cover border-4 border-white shadow-md bg-slate-200 shrink-0">
                  <span class="mt-2 font-black text-slate-900 ${nameSize} leading-snug break-words w-full">${name1}</span>
                </div>
                ${name2 ? `
                <div class="flex flex-col items-center w-full min-w-0">
                  <img src="${p2.HinhAnhDaiDien || defaultAvatar}" onerror="this.src='${defaultAvatar}'"
                       class="${imgSize} rounded-full object-cover border-4 border-white shadow-md bg-slate-200 shrink-0">
                  <span class="mt-2 font-black text-slate-900 ${nameSize} leading-snug break-words w-full">${name2}</span>
                </div>` : ''}
              </div>
              ${team.TenDoi ? `<div class="text-xs font-bold text-slate-500 uppercase tracking-wider break-words">${team.TenDoi}</div>` : ''}
            </div>
          `;
        };

        return `
          <div class="mb-10">
            <h2 class="text-2xl md:text-3xl font-black text-center uppercase tracking-wide mb-6 ${isSeriB ? 'text-sky-800' : 'text-emerald-800'}">
              <i class="fa-solid fa-star text-amber-400 mr-2"></i>${title}<i class="fa-solid fa-star text-amber-400 ml-2"></i>
            </h2>

            ${champList.length ? `
              <div class="flex flex-wrap justify-center gap-6 mb-6">
                ${champList.map(t => `<div class="w-full max-w-xl">${renderTeamPodiumCard(t, 'CHAMP')}</div>`).join('')}
              </div>
            ` : ''}

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-${Math.min(4, runnerUpList.length + thirdList.length) || 2} gap-5 max-w-7xl mx-auto">
              ${runnerUpList.map(t => renderTeamPodiumCard(t, 'SECOND')).join('')}
              ${thirdList.map(t => renderTeamPodiumCard(t, 'THIRD')).join('')}
            </div>
          </div>
        `;
      };

      const byAch = (val) => teams.filter(t => (t.ThanhTich || '').trim().toLowerCase() === val.toLowerCase());

      const mainHtml = renderPodiumBlock(
        'Bảng Vàng Thành Tích Giải Đấu',
        byAch('Vô địch'),
        byAch('Á quân'),
        byAch('Hạng ba'),
        false
      );

      const seriBHtml = renderPodiumBlock(
        'Bảng Vàng Thành Tích - Seri B',
        byAch('Vô địch Seri B'),
        byAch('Á quân Seri B'),
        byAch('Hạng ba Seri B'),
        true
      );

      container.innerHTML = `
        <div class="h-full overflow-y-auto px-4 py-6 bg-gradient-to-b from-sky-50 via-white to-amber-50/40 rounded-2xl">
          ${(mainHtml || seriBHtml)
            ? mainHtml + seriBHtml
            : '<div class="h-full flex items-center justify-center text-slate-400 text-2xl font-bold">Chưa cập nhật thành tích cho giải đấu này</div>'}
        </div>
      `;
    }
  </script>
</body>
</html>
