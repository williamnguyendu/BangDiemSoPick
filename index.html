<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pickleball Live Scoreboard - TV Display</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Be Vietnam Pro -->
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #f0f4f8;
      color: #0f172a;
      overflow-x: hidden;
    }

    /* Custom Scrollbar gọn gàng cho TV */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    /* Hiệu ứng tỏa sáng cho Bục Vô Địch */
    @keyframes championGlow {
      0%, 100% {
        box-shadow: 0 0 25px rgba(250, 204, 21, 0.7), 0 0 50px rgba(234, 179, 8, 0.4), inset 0 0 15px rgba(254, 240, 138, 0.6);
        transform: translateY(0px);
      }
      50% {
        box-shadow: 0 0 40px rgba(250, 204, 21, 1), 0 0 80px rgba(234, 179, 8, 0.7), inset 0 0 25px rgba(254, 240, 138, 0.9);
        transform: translateY(-4px);
      }
    }
    .champion-card {
      animation: championGlow 3s infinite ease-in-out;
      border: 3px solid #facc15;
      background: linear-gradient(145deg, #fffbeb 0%, #fef08a 100%);
    }

    /* Khung trận đấu theo trạng thái */
    .match-live {
      background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%) !important;
      border: 2px solid #22c55e !important;
    }
    .match-ready {
      background: linear-gradient(135deg, #fef9c3 0%, #fef08a 100%) !important;
      border: 2px solid #eab308 !important;
    }
    .match-waiting {
      background: #ffffff;
      border: 1px solid #cbd5e1;
    }
    .match-finished {
      background: #ffffff;
      border: 1px solid #e2e8f0;
    }
  </style>
</head>
<body class="h-screen flex flex-col select-none">

  <!-- ==================== MÀN HÌNH 1: CHỌN GIẢI ĐẤU ==================== -->
  <div id="tournament-selector-screen" class="min-h-screen flex flex-col items-center justify-center p-8 bg-gradient-to-br from-sky-50 via-white to-emerald-50">
    <div class="max-w-6xl w-full">
      <div class="text-center mb-10">
        <div class="inline-flex items-center gap-3 bg-emerald-600 text-white px-5 py-2 rounded-full text-sm font-bold uppercase tracking-wider shadow-md mb-4">
          <i class="fa-solid fa-table-tennis-paddle-ball"></i> Hệ Thống Hiển Thị Điểm Trực Tuyến
        </div>
        <h1 class="text-4xl md:text-5xl font-black text-slate-900 tracking-tight">CHỌN GIẢI ĐẤU PICKLEBALL</h1>
        <p class="text-slate-500 text-lg mt-2">Chọn giải đấu bên dưới để mở bảng điểm trực tiếp trên màn hình TV</p>
      </div>

      <!-- Loading -->
      <div id="selector-loading" class="flex flex-col items-center justify-center py-16">
        <div class="w-14 h-14 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-slate-600 font-semibold text-lg">Đang tải danh sách giải đấu...</p>
      </div>

      <!-- Grid Giải đấu -->
      <div id="tournaments-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>
    </div>
  </div>

  <!-- ==================== MÀN HÌNH 2: BẢNG ĐIỂM GIẢI ĐẤU (TV VIEW) ==================== -->
  <div id="scoreboard-screen" class="h-screen flex flex-col hidden">
    
    <!-- TOP HEADER & NAVIGATION MENU -->
    <header class="bg-gradient-to-r from-slate-900 via-sky-950 to-emerald-950 text-white px-4 py-2.5 shadow-lg flex flex-wrap lg:flex-nowrap items-center justify-between gap-3 shrink-0 border-b-4 border-emerald-500">
      <!-- Thông tin giải đấu (Hiển thị đầy đủ chữ, không truncate) -->
      <div class="flex items-center gap-3 flex-1 min-w-[260px]">
        <button onclick="backToSelector()" title="Đổi giải đấu" class="bg-white/10 hover:bg-white/20 text-white px-2.5 py-1.5 rounded-lg transition flex items-center gap-1.5 text-xs font-semibold shrink-0">
          <i class="fa-solid fa-arrow-left"></i> Giải đấu
        </button>
        <div>
          <h1 id="header-tour-name" class="text-base md:text-lg xl:text-xl font-extrabold tracking-tight text-white leading-snug break-words">TÊN GIẢI ĐẤU</h1>
          <div class="flex flex-wrap items-center gap-x-3 gap-y-0.5 text-[11px] md:text-xs text-sky-200 font-medium">
            <span id="header-tour-org"><i class="fa-solid fa-building mr-1"></i> Đơn vị tổ chức</span>
            <span id="header-tour-date"><i class="fa-regular fa-calendar mr-1"></i> Ngày thi đấu</span>
          </div>
        </div>
      </div>

      <!-- Thanh Menu Chọn Vòng Thi Đấu & Thành Tích (Gọn gàng) -->
      <nav id="rounds-nav" class="flex items-center gap-1.5 overflow-x-auto py-0.5 shrink-0">
        <!-- Render động các nút vòng đấu -->
      </nav>

      <!-- Nút Load Data & Đồng hồ -->
      <div class="flex items-center gap-2.5 shrink-0">
        <button id="btn-refresh-data" onclick="manualRefreshData()" title="Cập nhật dữ liệu mới nhất"
                class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow transition cursor-pointer">
          <i id="refresh-icon" class="fa-solid fa-rotate-right"></i>
          <span>Cập nhật</span>
        </button>
        <div id="live-clock" class="text-sm md:text-base font-mono font-bold text-amber-300 bg-black/30 px-2.5 py-1 rounded-lg">00:00</div>
      </div>
    </header>

    <!-- Loading Overlay khi chuyển giải -->
    <div id="board-loading" class="flex-1 flex flex-col items-center justify-center bg-slate-50">
      <div class="w-16 h-16 border-4 border-sky-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="mt-4 text-slate-700 font-bold text-xl">Đang tải dữ liệu thi đấu...</p>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main id="board-content" class="flex-1 overflow-hidden p-4 hidden">
      <!-- Nội dung sẽ được render linh hoạt theo tab đang chọn -->
    </main>
  </div>

  <script>
    // =========================================================================
    // CẤU HÌNH API GOOGLE APPS SCRIPT (THAY LINK CỦA BẠN VÀO ĐÂY)
    // =========================================================================
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw8xU6EaqNoXTZFZu3K_sGiwr5KVo5wz0myYM7njzPXh2olrx-pC9-wakwb7VhFPrMQlA/exec';

    // Biến toàn cục lưu trạng thái
    let currentMaGiaiDau = null;
    let tournamentData = null;
    let activeTab = null;
    let refreshInterval = null;
    let isFetching = false;

    // Thứ tự sắp xếp chuẩn: Vòng bảng --> Tứ kết --> Bán kết --> Chung kết (sau đó đến Seri B)
    const ROUND_ORDER = [
      'Vòng bảng',
      'Tứ kết',
      'Bán kết',
      'Chung kết',
      'Tứ kết Seri B',
      'Bán kết Seri B',
      'Chung kết Seri B'
    ];

    // =========================================================================
    // KHỞI TẠO & ĐIỀU HƯỚNG URL
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      startClock();
      const urlParams = new URLSearchParams(window.location.search);
      const giaiParam = urlParams.get('giai');

      if (giaiParam) {
        selectTournament(giaiParam, false);
      } else {
        loadTournamentsList();
      }
    });

    window.addEventListener('popstate', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const giaiParam = urlParams.get('giai');
      if (giaiParam) {
        selectTournament(giaiParam, false);
      } else {
        showSelectorScreen();
      }
    });

    function startClock() {
      const update = () => {
        const now = new Date();
        document.getElementById('live-clock').textContent =
          now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      };
      update();
      setInterval(update, 1000);
    }

    function showSelectorScreen() {
      if (refreshInterval) clearInterval(refreshInterval);
      currentMaGiaiDau = null;
      document.getElementById('scoreboard-screen').classList.add('hidden');
      document.getElementById('tournament-selector-screen').classList.remove('hidden');
      loadTournamentsList();
    }

    function backToSelector() {
      const url = new URL(window.location);
      url.searchParams.delete('giai');
      window.history.pushState({}, '', url);
      showSelectorScreen();
    }

    // =========================================================================
    // MÀN HÌNH 1: LOAD DANH SÁCH GIẢI ĐẤU
    // =========================================================================
    async function loadTournamentsList() {
      const loadingEl = document.getElementById('selector-loading');
      const gridEl = document.getElementById('tournaments-grid');
      loadingEl.classList.remove('hidden');
      gridEl.classList.add('hidden');

      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?action=getTournaments`);
        const json = await res.json();
        if (json.status !== 'success') throw new Error(json.message);

        renderTournamentsGrid(json.data || []);
      } catch (err) {
        loadingEl.innerHTML = `<div class="text-red-600 font-bold text-lg"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Lỗi tải dữ liệu: ${err.message}</div>`;
      }
    }

    function renderTournamentsGrid(list) {
      const loadingEl = document.getElementById('selector-loading');
      const gridEl = document.getElementById('tournaments-grid');
      loadingEl.classList.add('hidden');
      gridEl.classList.remove('hidden');

      if (list.length === 0) {
        gridEl.innerHTML = `<div class="col-span-full text-center text-slate-500 text-xl py-12">Hiện chưa có giải đấu nào được hiển thị.</div>`;
        return;
      }

      gridEl.innerHTML = list.map(t => {
        let statusBadge = 'bg-slate-100 text-slate-700';
        if (t.TrangThai === 'Đang diễn ra') statusBadge = 'bg-emerald-100 text-emerald-700 border border-emerald-300';
        else if (t.TrangThai === 'Sắp diễn ra') statusBadge = 'bg-amber-100 text-amber-700 border border-amber-300';

        const posterHtml = t.Poster
          ? `<img src="${t.Poster}" alt="${t.TenGiaiDau}" class="w-full h-44 object-cover">`
          : `<div class="w-full h-44 bg-gradient-to-r from-sky-600 to-emerald-600 flex items-center justify-center text-white text-5xl"><i class="fa-solid fa-trophy"></i></div>`;

        return `
          <div onclick="selectTournament('${t.MaGiaiDau}', true)"
               class="bg-white rounded-2xl shadow-md hover:shadow-2xl border border-slate-200 overflow-hidden cursor-pointer transition-all duration-200 hover:-translate-y-1 flex flex-col">
            <div class="relative">
              ${posterHtml}
              <span class="absolute top-3 right-3 px-3 py-1 rounded-full text-xs font-extrabold shadow ${statusBadge}">
                ${t.TrangThai || 'Giải đấu'}
              </span>
            </div>
            <div class="p-5 flex-1 flex flex-col justify-between">
              <div>
                <h2 class="text-xl font-extrabold text-slate-900 line-clamp-2 mb-2">${t.TenGiaiDau}</h2>
                <div class="space-y-1 text-sm text-slate-600 mb-3">
                  <div><i class="fa-regular fa-calendar text-emerald-600 w-5"></i> <strong>Ngày:</strong> ${t.NgayThiDau || 'Đang cập nhật'}</div>
                  <div><i class="fa-solid fa-building text-sky-600 w-5"></i> <strong>Đơn vị:</strong> ${t.DonViToChuc || 'Đang cập nhật'}</div>
                </div>
                <p class="text-sm text-slate-500 line-clamp-2">${t.MoTa || ''}</p>
              </div>
              <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-emerald-600 font-bold text-sm">
                <span>Mở bảng điểm TV</span>
                <i class="fa-solid fa-arrow-right"></i>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // =========================================================================
    // MÀN HÌNH 2: LOAD & CẬP NHẬT DỮ LIỆU GIẢI ĐẤU (AUTO-SYNC MỖI 5 PHÚT)
    // =========================================================================
    async function selectTournament(maGiaiDau, pushUrl = true) {
      currentMaGiaiDau = maGiaiDau;
      if (pushUrl) {
        const url = new URL(window.location);
        url.searchParams.set('giai', maGiaiDau);
        window.history.pushState({}, '', url);
      }

      document.getElementById('tournament-selector-screen').classList.add('hidden');
      document.getElementById('scoreboard-screen').classList.remove('hidden');
      document.getElementById('board-loading').classList.remove('hidden');
      document.getElementById('board-content').classList.add('hidden');

      await fetchTournamentData(true);

      // Tự động load data mới sau mỗi 5 phút (300.000 ms), giữ nguyên tab đang xem
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(() => fetchTournamentData(false), 5 * 60 * 1000);
    }

    function manualRefreshData() {
      fetchTournamentData(false);
    }

    async function fetchTournamentData(isInitial) {
      if (!currentMaGiaiDau || isFetching) return;
      isFetching = true;

      const refreshIcon = document.getElementById('refresh-icon');
      const refreshBtn = document.getElementById('btn-refresh-data');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');
      if (refreshBtn) refreshBtn.classList.add('opacity-75');

      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?action=getTournamentData&maGiaiDau=${encodeURIComponent(currentMaGiaiDau)}`);
        const json = await res.json();
        if (json.status !== 'success') throw new Error(json.message);

        // Kiểm tra xem dữ liệu có thay đổi không (nếu không đổi khi auto-refresh thì không cần re-render lại DOM)
        const newDataStr = JSON.stringify(json.data);
        const oldDataStr = tournamentData ? JSON.stringify(tournamentData) : '';

        if (isInitial || newDataStr !== oldDataStr) {
          tournamentData = json.data;
          updateHeaderInfo();
          buildNavigationMenu(isInitial);

          if (isInitial) {
            document.getElementById('board-loading').classList.add('hidden');
            document.getElementById('board-content').classList.remove('hidden');
          }
          renderActiveTab();
        }
      } catch (err) {
        console.error('Lỗi đồng bộ dữ liệu:', err);
        if (isInitial) {
          document.getElementById('board-loading').innerHTML =
            `<div class="text-red-600 font-bold text-xl">Không thể tải dữ liệu giải đấu: ${err.message}</div>`;
        }
      } finally {
        isFetching = false;
        if (refreshIcon) refreshIcon.classList.remove('animate-spin');
        if (refreshBtn) refreshBtn.classList.remove('opacity-75');
      }
    }

    function updateHeaderInfo() {
      const t = tournamentData.tournament || {};
      document.getElementById('header-tour-name').textContent = t.TenGiaiDau || currentMaGiaiDau;
      document.getElementById('header-tour-org').innerHTML = `<i class="fa-solid fa-building mr-1 text-emerald-400"></i> ${t.DonViToChuc || ''}`;
      document.getElementById('header-tour-date').innerHTML = `<i class="fa-regular fa-calendar mr-1 text-sky-400"></i> ${t.NgayThiDau || ''}`;
      document.title = `${t.TenGiaiDau || 'Pickleball'} - Live Scoreboard`;
    }

    function buildNavigationMenu(isInitial) {
      const matches = tournamentData.matches || [];
      const uniqueRounds = [...new Set(matches.map(m => m.Vong).filter(Boolean))];

      // Sắp xếp chuẩn: Vòng bảng -> Tứ kết -> Bán kết -> Chung kết -> Seri B
      uniqueRounds.sort((a, b) => {
        const idxA = ROUND_ORDER.findIndex(r => r.toLowerCase() === a.trim().toLowerCase());
        const idxB = ROUND_ORDER.findIndex(r => r.toLowerCase() === b.trim().toLowerCase());
        if (idxA === -1 && idxB === -1) return a.localeCompare(b);
        if (idxA === -1) return 1;
        if (idxB === -1) return -1;
        return idxA - idxB;
      });

      const tabs = [...uniqueRounds, 'THANH_TICH'];

      // Giữ nguyên tab hiện tại khi auto-refresh; chỉ chọn mặc định khi mới vào giải
      if (isInitial || !tabs.includes(activeTab)) {
        activeTab = uniqueRounds.length > 0 ? uniqueRounds[0] : 'THANH_TICH';
      }

      const navEl = document.getElementById('rounds-nav');
      navEl.innerHTML = tabs.map(tab => {
        const isAch = tab === 'THANH_TICH';
        const label = isAch ? '<i class="fa-solid fa-trophy text-amber-400 mr-1"></i>Thành tích' : tab;
        const isActive = activeTab === tab;
        const activeClass = isActive
          ? 'bg-emerald-500 text-slate-950 font-extrabold shadow'
          : 'bg-white/10 hover:bg-white/20 text-white font-semibold';

        return `
          <button onclick="switchTab('${tab}')"
                  class="px-2.5 py-1.5 rounded-lg text-xs md:text-sm transition-all whitespace-nowrap cursor-pointer ${activeClass}">
            ${label}
          </button>
        `;
      }).join('');
    }

    function switchTab(tab) {
      activeTab = tab;
      buildNavigationMenu(false);
      renderActiveTab();
    }

    // =========================================================================
    // ĐIỀU PHỐI RENDER GIAO DIỆN THEO VÒNG ĐẤU
    // =========================================================================
    function renderActiveTab() {
      const container = document.getElementById('board-content');
      if (!activeTab) return;

      if (activeTab === 'THANH_TICH') {
        renderAchievementsView(container);
      } else if (activeTab.toLowerCase() === 'vòng bảng') {
        renderGroupStageView(container);
      } else if (activeTab.toLowerCase().includes('chung kết')) {
        renderFinalRoundView(container, activeTab);
      } else {
        renderKnockoutRoundView(container, activeTab);
      }
    }

    // =========================================================================
    // HELPER: LẤY BIỆT DANH VĐV (FALLBACK HỌ TÊN) & XỬ LÝ WRAP TEXT
    // =========================================================================
    function getTeamsMap() {
      const map = {};
      (tournamentData.teams || []).forEach(t => {
        map[t.MaDoi] = t;
      });
      return map;
    }

    function getPlayerDisplayName(vdvObj) {
      if (!vdvObj) return '';
      const nick = (vdvObj.BietDanh || '').trim();
      const full = (vdvObj.HoTen || '').trim();
      return nick || full;
    }

    function getTeamPlayersDisplay(teamObj) {
      if (!teamObj) {
        return `<span class="italic text-slate-400 font-semibold">Chờ kết quả</span>`;
      }
      const p1 = getPlayerDisplayName(teamObj.VDV1);
      const p2 = getPlayerDisplayName(teamObj.VDV2);
      if (!p1 && !p2) return `<span class="font-bold break-words">${teamObj.TenDoi || 'Chờ kết quả'}</span>`;
      return `
        <div class="leading-snug space-y-0.5 break-words whitespace-normal">
          <div>${p1}</div>
          ${p2 ? `<div>${p2}</div>` : ''}
        </div>
      `;
    }

    function parseVNDateTime(str) {
      if (!str) return 0;
      const parts = str.trim().split(/\s+/);
      const dateParts = parts[0].split('/');
      if (dateParts.length < 3) return 0;
      const day = parseInt(dateParts[0], 10);
      const month = parseInt(dateParts[1], 10) - 1;
      const year = parseInt(dateParts[2], 10);
      let hour = 0, min = 0;
      if (parts[1]) {
        const timeParts = parts[1].split(':');
        hour = parseInt(timeParts[0], 10) || 0;
        min = parseInt(timeParts[1], 10) || 0;
      }
      return new Date(year, month, day, hour, min).getTime();
    }

    // =========================================================================
    // COMPONENT: THẺ TRẬN ĐẤU
    // =========================================================================
    function renderMatchCard(match, teamsMap, isLargeFinal = false) {
      const team1 = teamsMap[match.MaDoiThu1];
      const team2 = teamsMap[match.MaDoiThu2];
      const status = (match.TrangThai || 'Chờ thi đấu').trim();

      const isFinished = status === 'Đã thi đấu';
      const isLive = status === 'Đang thi đấu';
      const isReady = status === 'Chuẩn bị thi đấu';

      let cardClass = 'match-waiting';
      let badgeClass = 'bg-slate-200 text-slate-700';
      if (isLive) {
        cardClass = 'match-live shadow-md';
        badgeClass = 'bg-emerald-600 text-white animate-pulse';
      } else if (isReady) {
        cardClass = 'match-ready shadow-sm';
        badgeClass = 'bg-amber-500 text-slate-950 font-extrabold';
      } else if (isFinished) {
        cardClass = 'match-finished';
        badgeClass = 'bg-sky-100 text-sky-800';
      }

      const rawS1 = match.DiemTySoDoiThu1;
      const rawS2 = match.DiemTySoDoiThu2;
      const hasScore = rawS1 !== '' || rawS2 !== '';
      const numS1 = parseFloat(rawS1);
      const numS2 = parseFloat(rawS2);

      let t1Win = false, t2Win = false;
      if (hasScore && !isNaN(numS1) && !isNaN(numS2)) {
        if (numS1 > numS2) t1Win = true;
        else if (numS2 > numS1) t2Win = true;
      }

      const t1Color = t1Win ? 'text-emerald-700 font-black' : 'text-slate-800 font-bold';
      const t2Color = t2Win ? 'text-emerald-700 font-black' : 'text-slate-800 font-bold';
      const s1Color = t1Win ? 'text-emerald-600' : 'text-slate-800';
      const s2Color = t2Win ? 'text-emerald-600' : 'text-slate-800';

      const diff1 = match.HieuSoDoiThu1 !== '' ? `(${Number(match.HieuSoDoiThu1) > 0 ? '+' : ''}${match.HieuSoDoiThu1})` : '';
      const diff2 = match.HieuSoDoiThu2 !== '' ? `(${Number(match.HieuSoDoiThu2) > 0 ? '+' : ''}${match.HieuSoDoiThu2})` : '';

      const showScore = isFinished || isLive || hasScore;
      const score1Display = showScore && rawS1 !== '' ? rawS1 : '';
      const score2Display = showScore && rawS2 !== '' ? rawS2 : '';

      const padClass = isLargeFinal ? 'p-8 rounded-3xl' : 'p-3.5 rounded-xl';
      const nameSize = isLargeFinal ? 'text-2xl md:text-3xl' : 'text-sm md:text-base';
      const scoreSize = isLargeFinal ? 'text-5xl md:text-6xl' : 'text-2xl md:text-3xl';

      return `
        <div class="${cardClass} ${padClass} transition-all flex flex-col justify-between">
          <!-- Hàng trên: Trạng thái - Sân/Giờ/Trọng tài - Mã trận -->
          <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5 pb-1.5 border-b border-black/10 text-xs">
            <span class="px-2.5 py-0.5 rounded-md font-bold uppercase tracking-wide shrink-0 ${badgeClass}">
              ${isLive ? '<i class="fa-solid fa-circle text-[8px] mr-1"></i>' : ''}${status}
            </span>

            <div class="flex flex-wrap items-center justify-center gap-2.5 text-slate-600 font-semibold ${isLargeFinal ? 'text-base' : 'text-xs'}">
              ${match.SanThiDau ? `<span class="bg-white/80 px-2 py-0.5 rounded border border-slate-200 text-sky-800 font-bold"><i class="fa-solid fa-location-dot mr-1 text-red-500"></i>${match.SanThiDau}</span>` : ''}
              ${match.NgayGioThiDau ? `<span><i class="fa-regular fa-clock mr-1"></i>${match.NgayGioThiDau}</span>` : ''}
              ${match.TenTrongTai ? `<span><i class="fa-solid fa-user-tie mr-1"></i>TT: ${match.TenTrongTai}</span>` : ''}
            </div>

            <span class="text-[11px] font-mono font-bold text-slate-400 bg-black/5 px-2 py-0.5 rounded shrink-0">
              #${match.MaTran || ''}
            </span>
          </div>

          <!-- Hàng chính: Đội 1 (Trái) - Tỷ số (Giữa) - Đội 2 (Phải) -->
          <div class="grid grid-cols-12 items-center gap-2">
            <!-- Đội 1 -->
            <div class="col-span-5 text-left min-w-0 ${nameSize} ${t1Color}">
              ${getTeamPlayersDisplay(team1)}
            </div>

            <!-- Tỷ số & Hiệu số -->
            <div class="col-span-2 flex items-center justify-center gap-1.5 bg-white/90 rounded-xl py-1.5 px-1.5 shadow-inner border border-slate-200/80 shrink-0">
              <div class="text-center min-w-[24px]">
                <div class="${scoreSize} font-black leading-none ${s1Color}">${score1Display}</div>
                ${showScore && diff1 ? `<div class="text-[11px] font-bold text-slate-500 mt-1">${diff1}</div>` : ''}
              </div>
              <div class="text-slate-400 font-black text-base">:</div>
              <div class="text-center min-w-[24px]">
                <div class="${scoreSize} font-black leading-none ${s2Color}">${score2Display}</div>
                ${showScore && diff2 ? `<div class="text-[11px] font-bold text-slate-500 mt-1">${diff2}</div>` : ''}
              </div>
            </div>

            <!-- Đội 2 -->
            <div class="col-span-5 text-right min-w-0 ${nameSize} ${t2Color}">
              ${getTeamPlayersDisplay(team2)}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 1: VÒNG BẢNG
    // =========================================================================
    function renderGroupStageView(container) {
      const teams = tournamentData.teams || [];
      const groupMatches = (tournamentData.matches || []).filter(m => m.Vong && m.Vong.toLowerCase() === 'vòng bảng');
      const teamsMap = getTeamsMap();

      const statsMap = {};
      teams.forEach(t => {
        statsMap[t.MaDoi] = {
          team: t,
          played: 0,
          totalMatches: 0,
          points: 0,
          diff: 0
        };
      });

      groupMatches.forEach(m => {
        const isDone = (m.TrangThai || '').trim() === 'Đã thi đấu';
        if (statsMap[m.MaDoiThu1]) {
          statsMap[m.MaDoiThu1].totalMatches += 1;
          if (isDone) {
            statsMap[m.MaDoiThu1].played += 1;
            statsMap[m.MaDoiThu1].points += parseFloat(m.DiemDoiThu1) || 0;
            statsMap[m.MaDoiThu1].diff += parseFloat(m.HieuSoDoiThu1) || 0;
          }
        }
        if (statsMap[m.MaDoiThu2]) {
          statsMap[m.MaDoiThu2].totalMatches += 1;
          if (isDone) {
            statsMap[m.MaDoiThu2].played += 1;
            statsMap[m.MaDoiThu2].points += parseFloat(m.DiemDoiThu2) || 0;
            statsMap[m.MaDoiThu2].diff += parseFloat(m.HieuSoDoiThu2) || 0;
          }
        }
      });

      const groups = {};
      Object.values(statsMap).forEach(item => {
        const grpName = item.team.BangThiDau || 'Khác';
        if (!groups[grpName]) groups[grpName] = [];
        groups[grpName].push(item);
      });

      const sortedGroupNames = Object.keys(groups).sort((a, b) => a.localeCompare(b));

      sortedGroupNames.forEach(gName => {
        groups[gName].sort((a, b) => {
          if (b.points !== a.points) return b.points - a.points;
          return b.diff - a.diff;
        });
      });

      const gridColsClass = sortedGroupNames.length >= 3 ? 'grid-cols-1 xl:grid-cols-2' : 'grid-cols-1';

      const groupsHtml = sortedGroupNames.map(gName => {
        const rowsHtml = groups[gName].map((st, idx) => {
          const isTop2 = idx < 2;
          const rowBg = isTop2 ? 'bg-emerald-100/90 hover:bg-emerald-200/80 font-semibold' : 'bg-white hover:bg-slate-50';
          const badgeRank = isTop2
            ? `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-600 text-white text-xs font-black">${idx + 1}</span>`
            : `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-200 text-slate-700 text-xs font-bold">${idx + 1}</span>`;

          const p1 = getPlayerDisplayName(st.team.VDV1);
          const p2 = getPlayerDisplayName(st.team.VDV2);

          return `
            <tr class="${rowBg} border-b border-slate-200 transition">
              <td class="py-2.5 px-2 text-center align-middle">${badgeRank}</td>
              <td class="py-2.5 px-2 align-middle break-words whitespace-normal">
                <div class="text-slate-900 font-bold text-sm leading-snug">${p1}</div>
                ${p2 ? `<div class="text-slate-700 font-semibold text-sm leading-snug">${p2}</div>` : ''}
              </td>
              <td class="py-2.5 px-2 text-center align-middle font-mono font-bold text-slate-700 text-sm whitespace-nowrap">
                ${st.played}/${st.totalMatches}
              </td>
              <td class="py-2.5 px-2 text-center align-middle font-black text-base text-sky-700 whitespace-nowrap">
                ${st.points}
              </td>
              <td class="py-2.5 px-2 text-center align-middle font-bold text-sm whitespace-nowrap ${st.diff > 0 ? 'text-emerald-700' : (st.diff < 0 ? 'text-rose-600' : 'text-slate-600')}">
                ${st.diff > 0 ? '+' : ''}${st.diff}
              </td>
            </tr>
          `;
        }).join('');

        return `
          <div class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden flex flex-col">
            <div class="bg-gradient-to-r from-sky-700 to-emerald-600 px-4 py-2.5 flex items-center justify-between">
              <h3 class="text-xl font-black text-white tracking-wide uppercase">
                <i class="fa-solid fa-layer-group mr-2 text-amber-300"></i>BẢNG ${gName}
              </h3>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse table-fixed">
                <thead>
                  <tr class="bg-slate-100 text-slate-600 text-xs uppercase font-extrabold border-b border-slate-300">
                    <th class="py-2 px-2 text-center w-10">#</th>
                    <th class="py-2 px-2">Vận động viên</th>
                    <th class="py-2 px-2 text-center w-14">Trận</th>
                    <th class="py-2 px-2 text-center w-14">Điểm</th>
                    <th class="py-2 px-2 text-center w-14">HS</th>
                  </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
              </table>
            </div>
          </div>
        `;
      }).join('');

      const finishedMatches = groupMatches
        .filter(m => (m.TrangThai || '').trim() === 'Đã thi đấu')
        .sort((a, b) => parseVNDateTime(b.ThoiGianKetThuc) - parseVNDateTime(a.ThoiGianKetThuc));

      const statusPriority = { 'Đang thi đấu': 1, 'Chuẩn bị thi đấu': 2, 'Chờ thi đấu': 3 };
      const upcomingMatches = groupMatches
        .filter(m => (m.TrangThai || '').trim() !== 'Đã thi đấu')
        .sort((a, b) => {
          const pA = statusPriority[(a.TrangThai || '').trim()] || 9;
          const pB = statusPriority[(b.TrangThai || '').trim()] || 9;
          if (pA !== pB) return pA - pB;
          return parseVNDateTime(a.NgayGioThiDau) - parseVNDateTime(b.NgayGioThiDau);
        });

      container.innerHTML = `
        <div class="h-full grid grid-cols-1 lg:grid-cols-12 gap-4">
          <!-- BÊN TRÁI (6/12): CÁC BẢNG THI ĐẤU -->
          <div class="lg:col-span-6 h-full overflow-y-auto pr-1">
            <div class="grid ${gridColsClass} gap-4">
              ${groupsHtml || '<div class="text-slate-500 text-center py-10">Chưa có dữ liệu bảng đấu</div>'}
            </div>
          </div>

          <!-- BÊN PHẢI (6/12): CHIA 2 PHẦN TRÊN VÀ DƯỚI -->
          <div class="lg:col-span-6 h-full flex flex-col gap-4 overflow-hidden">
            <!-- Nửa trên: Đã thi đấu -->
            <div class="flex-1 bg-slate-100/80 rounded-2xl border border-slate-300 p-3 flex flex-col overflow-hidden">
              <div class="flex items-center justify-between mb-2 px-1 shrink-0">
                <h3 class="font-black text-sky-900 uppercase text-sm md:text-base flex items-center gap-2">
                  <i class="fa-solid fa-flag-checkered text-sky-600"></i> Kết quả đã thi đấu (${finishedMatches.length})
                </h3>
                <span class="text-xs text-slate-500 font-semibold">Mới nhất lên đầu</span>
              </div>
              <div class="flex-1 overflow-y-auto space-y-2.5 pr-1">
                ${finishedMatches.length
                  ? finishedMatches.map(m => renderMatchCard(m, teamsMap)).join('')
                  : '<div class="text-center text-slate-400 py-8 font-medium">Chưa có trận nào hoàn thành</div>'}
              </div>
            </div>

            <!-- Nửa dưới: Đang thi đấu / Chuẩn bị / Chờ -->
            <div class="flex-1 bg-slate-100/80 rounded-2xl border border-slate-300 p-3 flex flex-col overflow-hidden">
              <div class="flex items-center justify-between mb-2 px-1 shrink-0">
                <h3 class="font-black text-emerald-900 uppercase text-sm md:text-base flex items-center gap-2">
                  <i class="fa-solid fa-fire text-amber-500"></i> Lịch & Sân đang/sắp đấu (${upcomingMatches.length})
                </h3>
                <div class="flex items-center gap-2 text-[11px] font-bold">
                  <span class="px-2 py-0.5 rounded bg-emerald-200 text-emerald-900">Đang đấu</span>
                  <span class="px-2 py-0.5 rounded bg-amber-200 text-amber-900">Chuẩn bị</span>
                </div>
              </div>
              <div class="flex-1 overflow-y-auto space-y-2.5 pr-1">
                ${upcomingMatches.length
                  ? upcomingMatches.map(m => renderMatchCard(m, teamsMap)).join('')
                  : '<div class="text-center text-slate-400 py-8 font-medium">Không còn trận chờ thi đấu</div>'}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 2: CÁC VÒNG LOẠI TRỰC TIẾP (TỨ KẾT, BÁN KẾT...)
    // =========================================================================
    function renderKnockoutRoundView(container, roundName) {
      const teamsMap = getTeamsMap();
      const roundMatches = (tournamentData.matches || []).filter(m => m.Vong === roundName);

      const allMatchesSorted = [...roundMatches].sort((a, b) => {
        return parseVNDateTime(a.NgayGioThiDau) - parseVNDateTime(b.NgayGioThiDau);
      });

      const priority = { 'Đang thi đấu': 1, 'Chuẩn bị thi đấu': 2 };
      const activeMatches = roundMatches
        .filter(m => ['Đang thi đấu', 'Chuẩn bị thi đấu'].includes((m.TrangThai || '').trim()))
        .sort((a, b) => {
          const pA = priority[(a.TrangThai || '').trim()] || 9;
          const pB = priority[(b.TrangThai || '').trim()] || 9;
          return pA - pB;
        });

      container.innerHTML = `
        <div class="h-full grid grid-cols-1 lg:grid-cols-12 gap-4">
          <!-- BÊN TRÁI (2/3 màn hình = 8/12) -->
          <div class="lg:col-span-8 h-full bg-slate-100/80 rounded-2xl border border-slate-300 p-4 flex flex-col overflow-hidden">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-300 shrink-0">
              <h2 class="text-xl font-black text-slate-900 uppercase">
                <i class="fa-solid fa-sitemap text-sky-600 mr-2"></i>Danh sách trận - ${roundName} (${allMatchesSorted.length})
              </h2>
            </div>
            <div class="flex-1 overflow-y-auto grid grid-cols-1 xl:grid-cols-2 gap-3 content-start pr-1">
              ${allMatchesSorted.length
                ? allMatchesSorted.map(m => renderMatchCard(m, teamsMap)).join('')
                : '<div class="col-span-full text-center text-slate-400 py-12">Chưa có trận đấu nào trong vòng này</div>'}
            </div>
          </div>

          <!-- BÊN PHẢI (1/3 màn hình = 4/12) -->
          <div class="lg:col-span-4 h-full bg-gradient-to-b from-emerald-50 to-amber-50/50 rounded-2xl border-2 border-emerald-200 p-4 flex flex-col overflow-hidden">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-emerald-200 shrink-0">
              <h2 class="text-lg font-black text-emerald-950 uppercase">
                <i class="fa-solid fa-bolt text-amber-500 mr-2"></i>Sân Đang & Sắp Đấu (${activeMatches.length})
              </h2>
            </div>
            <div class="flex-1 overflow-y-auto space-y-3 pr-1">
              ${activeMatches.length
                ? activeMatches.map(m => renderMatchCard(m, teamsMap)).join('')
                : '<div class="text-center text-slate-500 py-12 font-medium">Hiện không có trận nào đang hoặc chuẩn bị thi đấu</div>'}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 3: VÒNG CHUNG KẾT
    // =========================================================================
    function renderFinalRoundView(container, roundName) {
      const teamsMap = getTeamsMap();
      const finalMatches = (tournamentData.matches || []).filter(m => m.Vong === roundName);

      container.innerHTML = `
        <div class="h-full flex flex-col items-center justify-center bg-gradient-to-br from-sky-900 via-slate-900 to-emerald-950 rounded-3xl p-6 md:p-10 shadow-2xl border-4 border-amber-400/70 overflow-y-auto">
          <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 bg-amber-400 text-slate-950 px-6 py-2 rounded-full font-black uppercase tracking-widest text-sm md:text-base shadow-lg mb-3">
              <i class="fa-solid fa-crown"></i> Trận Đấu Tranh Ngôi Vô Địch
            </div>
            <h2 class="text-4xl md:text-6xl font-black text-white uppercase tracking-tight drop-shadow">
              ${roundName}
            </h2>
          </div>

          <div class="w-full max-w-5xl space-y-6">
            ${finalMatches.length
              ? finalMatches.map(m => renderMatchCard(m, teamsMap, true)).join('')
              : '<div class="text-center text-white/70 text-2xl py-10">Chưa cập nhật cặp đấu Chung kết</div>'}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 4: BỤC VINH QUANG THÀNH TÍCH
    // =========================================================================
    function renderAchievementsView(container) {
      const teams = tournamentData.teams || [];

      const renderPodiumBlock = (title, champList, runnerUpList, thirdList, isSeriB = false) => {
        const hasAny = champList.length || runnerUpList.length || thirdList.length;
        if (!hasAny) return '';

        const renderTeamPodiumCard = (team, rankType) => {
          const p1 = team.VDV1 || {};
          const p2 = team.VDV2 || {};
          const name1 = getPlayerDisplayName(p1);
          const name2 = getPlayerDisplayName(p2);
          const defaultAvatar = 'https://cdn-icons-png.flaticon.com/512/166/166344.png';

          let cardStyle = 'bg-white border-2 border-slate-200 shadow-lg';
          let ribbon = '';
          let imgSize = 'w-24 h-24 md:w-28 md:h-28';
          let nameSize = 'text-base md:text-lg';

          if (rankType === 'CHAMP') {
            cardStyle = 'champion-card shadow-2xl';
            ribbon = `<div class="bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-500 text-slate-950 font-black px-5 py-1.5 rounded-full text-sm md:text-base uppercase tracking-wider shadow inline-flex items-center gap-2 mb-4"><i class="fa-solid fa-trophy"></i> ${isSeriB ? 'Vô Địch Seri B' : 'Vô Địch'}</div>`;
            imgSize = 'w-28 h-28 md:w-36 md:h-36';
            nameSize = 'text-lg md:text-2xl';
          } else if (rankType === 'SECOND') {
            cardStyle = 'bg-gradient-to-b from-slate-100 to-slate-200 border-2 border-slate-400 shadow-xl';
            ribbon = `<div class="bg-slate-600 text-white font-extrabold px-4 py-1 rounded-full text-xs md:text-sm uppercase tracking-wider shadow inline-flex items-center gap-1.5 mb-3"><i class="fa-solid fa-medal text-slate-200"></i> ${isSeriB ? 'Á Quân Seri B' : 'Á Quân'}</div>`;
          } else {
            cardStyle = 'bg-gradient-to-b from-orange-50 to-amber-100/70 border-2 border-amber-600/40 shadow-lg';
            ribbon = `<div class="bg-amber-700 text-white font-extrabold px-4 py-1 rounded-full text-xs md:text-sm uppercase tracking-wider shadow inline-flex items-center gap-1.5 mb-3"><i class="fa-solid fa-award text-amber-200"></i> ${isSeriB ? 'Hạng Ba Seri B' : 'Hạng Ba'}</div>`;
          }

          return `
            <div class="${cardStyle} rounded-3xl p-5 flex flex-col items-center text-center transition-all">
              ${ribbon}
              <!-- Ảnh đại diện & Biệt danh 2 VĐV (tự động wrap text) -->
              <div class="grid ${name2 ? 'grid-cols-2' : 'grid-cols-1'} gap-4 w-full items-start justify-items-center mb-3">
                <div class="flex flex-col items-center w-full min-w-0">
                  <img src="${p1.HinhAnhDaiDien || defaultAvatar}" onerror="this.src='${defaultAvatar}'"
                       class="${imgSize} rounded-full object-cover border-4 border-white shadow-md bg-slate-200 shrink-0">
                  <span class="mt-2 font-black text-slate-900 ${nameSize} leading-snug break-words w-full">${name1}</span>
                </div>
                ${name2 ? `
                <div class="flex flex-col items-center w-full min-w-0">
                  <img src="${p2.HinhAnhDaiDien || defaultAvatar}" onerror="this.src='${defaultAvatar}'"
                       class="${imgSize} rounded-full object-cover border-4 border-white shadow-md bg-slate-200 shrink-0">
                  <span class="mt-2 font-black text-slate-900 ${nameSize} leading-snug break-words w-full">${name2}</span>
                </div>` : ''}
              </div>
              ${team.TenDoi ? `<div class="text-xs font-bold text-slate-500 uppercase tracking-wider break-words">${team.TenDoi}</div>` : ''}
            </div>
          `;
        };

        return `
          <div class="mb-10">
            <h2 class="text-2xl md:text-3xl font-black text-center uppercase tracking-wide mb-6 ${isSeriB ? 'text-sky-800' : 'text-emerald-800'}">
              <i class="fa-solid fa-star text-amber-400 mr-2"></i>${title}<i class="fa-solid fa-star text-amber-400 ml-2"></i>
            </h2>

            ${champList.length ? `
              <div class="flex flex-wrap justify-center gap-6 mb-6">
                ${champList.map(t => `<div class="w-full max-w-xl">${renderTeamPodiumCard(t, 'CHAMP')}</div>`).join('')}
              </div>
            ` : ''}

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-${Math.min(4, runnerUpList.length + thirdList.length) || 2} gap-5 max-w-7xl mx-auto">
              ${runnerUpList.map(t => renderTeamPodiumCard(t, 'SECOND')).join('')}
              ${thirdList.map(t => renderTeamPodiumCard(t, 'THIRD')).join('')}
            </div>
          </div>
        `;
      };

      const byAch = (val) => teams.filter(t => (t.ThanhTich || '').trim().toLowerCase() === val.toLowerCase());

      const mainHtml = renderPodiumBlock(
        'Bảng Vàng Thành Tích Giải Đấu',
        byAch('Vô địch'),
        byAch('Á quân'),
        byAch('Hạng ba'),
        false
      );

      const seriBHtml = renderPodiumBlock(
        'Bảng Vàng Thành Tích - Seri B',
        byAch('Vô địch Seri B'),
        byAch('Á quân Seri B'),
        byAch('Hạng ba Seri B'),
        true
      );

      container.innerHTML = `
        <div class="h-full overflow-y-auto px-4 py-6 bg-gradient-to-b from-sky-50 via-white to-amber-50/40 rounded-2xl">
          ${(mainHtml || seriBHtml)
            ? mainHtml + seriBHtml
            : '<div class="h-full flex items-center justify-center text-slate-400 text-2xl font-bold">Chưa cập nhật thành tích cho giải đấu này</div>'}
        </div>
      `;
    }
  </script>
</body>
</html>
