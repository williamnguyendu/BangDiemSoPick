<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pickleball Live Scoreboard - TV Display</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Be Vietnam Pro -->
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: #f0f4f8;
      color: #0f172a;
      overflow-x: hidden;
    }

    /* Custom Scrollbar gọn gàng cho TV */
    ::-webkit-scrollbar { width: 7px; height: 8px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    /* Hiệu ứng tỏa sáng cho Bục Vô Địch */
    @keyframes championGlow {
      0%, 100% {
        box-shadow: 0 0 25px rgba(250, 204, 21, 0.7), 0 0 50px rgba(234, 179, 8, 0.4), inset 0 0 15px rgba(254, 240, 138, 0.6);
        transform: translateY(0px);
      }
      50% {
        box-shadow: 0 0 40px rgba(250, 204, 21, 1), 0 0 80px rgba(234, 179, 8, 0.7), inset 0 0 25px rgba(254, 240, 138, 0.9);
        transform: translateY(-4px);
      }
    }
    .champion-card {
      animation: championGlow 3s infinite ease-in-out;
      border: 3px solid #facc15;
      background: linear-gradient(145deg, #fffbeb 0%, #fef08a 100%);
    }

    /* Khung trận đấu theo trạng thái */
    .match-live {
      background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%) !important;
      border: 2px solid #22c55e !important;
    }
    .match-ready {
      background: linear-gradient(135deg, #fef9c3 0%, #fef08a 100%) !important;
      border: 2px solid #eab308 !important;
    }
    .match-waiting {
      background: #ffffff;
      border: 1px solid #cbd5e1;
    }
    .match-finished {
      background: #ffffff;
      border: 1px solid #e2e8f0;
    }

    /* Hiệu ứng sóng âm khi nút loa đang đọc */
    @keyframes speakerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .speaker-active {
      background-color: #0284c7 !important;
      color: #ffffff !important;
      border-color: #0369a1 !important;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.35);
      animation: speakerPulse 1s infinite ease-in-out;
    }

    /* Hiệu ứng trượt lên cho popup thông báo loa */
    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .speech-toast-enter {
      animation: slideUpFade 0.22s ease-out forwards;
    }
  </style>
</head>
<body class="h-screen flex flex-col select-none">

  <!-- ==================== MÀN HÌNH 1: CHỌN GIẢI ĐẤU ==================== -->
  <div id="tournament-selector-screen" class="min-h-screen flex flex-col items-center justify-center p-8 bg-gradient-to-br from-sky-50 via-white to-emerald-50">
    <div class="max-w-6xl w-full">
      <div class="text-center mb-10">
        <div class="inline-flex items-center gap-3 bg-emerald-600 text-white px-5 py-2 rounded-full text-sm font-bold uppercase tracking-wider shadow-md mb-4">
          <i class="fa-solid fa-table-tennis-paddle-ball"></i> Hệ Thống Hiển Thị Điểm Trực Tuyến
        </div>
        <h1 class="text-4xl md:text-5xl font-black text-slate-900 tracking-tight">CHỌN GIẢI ĐẤU PICKLEBALL</h1>
        <p class="text-slate-500 text-lg mt-2">Chọn giải đấu bên dưới để mở bảng điểm trực tiếp trên màn hình TV</p>
      </div>

      <!-- Loading -->
      <div id="selector-loading" class="flex flex-col items-center justify-center py-16">
        <div class="w-14 h-14 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-slate-600 font-semibold text-lg">Đang tải danh sách giải đấu...</p>
      </div>

      <!-- Grid Giải đấu -->
      <div id="tournaments-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>
    </div>
  </div>

  <!-- ==================== MÀN HÌNH 2: BẢNG ĐIỂM GIẢI ĐẤU (TV VIEW) ==================== -->
  <div id="scoreboard-screen" class="h-screen flex flex-col hidden">
    
    <!-- TOP HEADER & NAVIGATION MENU -->
    <header class="bg-gradient-to-r from-slate-900 via-sky-950 to-emerald-950 text-white px-4 py-2.5 shadow-lg flex flex-wrap lg:flex-nowrap items-center justify-between gap-3 shrink-0 border-b-4 border-emerald-500">
      <!-- Thông tin giải đấu -->
      <div class="flex items-center gap-3 flex-1 min-w-[260px]">
        <button onclick="backToSelector()" title="Đổi giải đấu" class="bg-white/10 hover:bg-white/20 text-white px-2.5 py-1.5 rounded-lg transition flex items-center gap-1.5 text-xs font-semibold shrink-0">
          <i class="fa-solid fa-arrow-left"></i> Giải đấu
        </button>
        <div>
          <h1 id="header-tour-name" class="text-base md:text-lg xl:text-xl font-extrabold tracking-tight text-white leading-snug break-words">TÊN GIẢI ĐẤU</h1>
          <div class="flex flex-wrap items-center gap-x-3 gap-y-0.5 text-[11px] md:text-xs text-sky-200 font-medium">
            <span id="header-tour-org"><i class="fa-solid fa-building mr-1"></i> Đơn vị tổ chức</span>
            <span id="header-tour-date"><i class="fa-regular fa-calendar mr-1"></i> Ngày thi đấu</span>
          </div>
        </div>
      </div>

      <!-- Thanh Menu Chọn Vòng Thi Đấu, Sơ đồ & Thành Tích -->
      <nav id="rounds-nav" class="flex items-center gap-1.5 overflow-x-auto py-0.5 shrink-0"></nav>

      <!-- Nút Load Data & Đồng hồ -->
      <div class="flex items-center gap-2.5 shrink-0">
        <button id="btn-refresh-data" onclick="manualRefreshData()" title="Cập nhật dữ liệu mới nhất"
                class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow transition cursor-pointer">
          <i id="refresh-icon" class="fa-solid fa-rotate-right"></i>
          <span>Cập nhật</span>
        </button>
        <div id="live-clock" class="text-sm md:text-base font-mono font-bold text-amber-300 bg-black/30 px-2.5 py-1 rounded-lg">00:00</div>
      </div>
    </header>

    <!-- Loading Overlay -->
    <div id="board-loading" class="flex-1 flex flex-col items-center justify-center bg-slate-50">
      <div class="w-16 h-16 border-4 border-sky-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="mt-4 text-slate-700 font-bold text-xl">Đang tải dữ liệu thi đấu...</p>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main id="board-content" class="flex-1 overflow-hidden p-4 hidden"></main>
  </div>

  <!-- ==================== POPUP DANH SÁCH TRẬN CỦA ĐỘI ==================== -->
  <div id="team-matches-modal" onclick="handleModalBackdropClick(event)"
       class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm hidden flex items-center justify-center p-4 md:p-6">
    <div class="bg-slate-50 w-full max-w-4xl max-h-[90vh] rounded-3xl shadow-2xl border-2 border-emerald-500 flex flex-col overflow-hidden">
      <!-- Modal Header -->
      <div class="bg-gradient-to-r from-slate-900 via-sky-950 to-emerald-950 text-white px-5 py-4 flex items-center justify-between gap-4 shrink-0 border-b-2 border-emerald-500">
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-2 mb-1">
            <span class="bg-emerald-500 text-slate-950 text-xs font-black uppercase px-2.5 py-0.5 rounded-md">
              <i class="fa-solid fa-users mr-1"></i>Lịch & Kết quả đội
            </span>
            <span id="modal-team-group" class="bg-sky-700 text-white text-xs font-extrabold px-2.5 py-0.5 rounded-md hidden"></span>
            <span id="modal-team-count" class="bg-white/15 text-amber-300 text-xs font-bold px-2.5 py-0.5 rounded-md"></span>
          </div>
          <h3 id="modal-team-title" class="text-lg md:text-2xl font-black text-white leading-snug break-words">Tên vận động viên</h3>
          <p id="modal-team-subtitle" class="text-xs text-sky-200 font-semibold mt-0.5 hidden"></p>
        </div>
        <button onclick="closeTeamMatchesModal()" title="Đóng (ESC)"
                class="w-10 h-10 rounded-xl bg-white/10 hover:bg-rose-600 text-white flex items-center justify-center text-lg font-bold transition shrink-0 cursor-pointer">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Modal Body: Danh sách trận -->
      <div id="modal-team-matches-list" class="flex-1 overflow-y-auto p-4 md:p-5 space-y-3"></div>
    </div>
  </div>

  <!-- ==================== POPUP NHỎ GÓC DƯỚI BÊN PHẢI: NỘI DUNG PHÁT LOA ==================== -->
  <div id="speech-announcement-popup"
       class="fixed bottom-4 right-4 left-4 sm:left-auto z-[60] sm:w-[450px] md:w-[500px] bg-white rounded-2xl shadow-2xl border-2 border-sky-500 overflow-hidden hidden speech-toast-enter">
    <!-- Header popup loa -->
    <div class="bg-gradient-to-r from-sky-800 via-sky-700 to-emerald-700 text-white px-4 py-2.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <span class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-volume-high text-amber-300 animate-pulse text-xs"></i>
        </span>
        <div class="min-w-0">
          <div class="text-xs md:text-sm font-black uppercase tracking-wide truncate">Thông báo phát loa</div>
          <div id="speech-popup-subtitle" class="text-[11px] text-sky-100 font-medium truncate"></div>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button type="button" id="btn-toggle-voice-engine" onclick="switchSpeechEngineMode()"
                title="Chuyển đổi nguồn giọng đọc tiếng Việt"
                class="px-2 py-1 rounded-lg bg-white/15 hover:bg-white/25 text-[10px] font-bold text-amber-200 border border-white/20 transition cursor-pointer">
          Giọng Việt
        </button>
        <button type="button" onclick="stopAnnouncement()" title="Tắt phát loa"
                class="w-7 h-7 rounded-lg bg-white/15 hover:bg-rose-600 text-white flex items-center justify-center text-sm font-bold transition cursor-pointer">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- Nội dung hệ thống đang đọc -->
    <div id="speech-popup-body"
         class="p-3.5 max-h-56 overflow-y-auto text-sm leading-relaxed text-slate-700 bg-sky-50/40 select-text">
    </div>
  </div>

  <script>
    // =========================================================================
    // CẤU HÌNH API GOOGLE APPS SCRIPT (THAY LINK CỦA BẠN VÀO ĐÂY)
    // =========================================================================
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzZztGJJ8m20Ki2UraP-luF2zWj87KvODrreu_qGvO0UkPCoqPeY3FXxQPQ8St9I2EJ5Q/exec';

    let currentMaGiaiDau = null;
    let tournamentData = null;
    let activeTab = null;
    let refreshInterval = null;
    let isFetching = false;
    let currentModalTeamId = null;

    // Biến điều khiển phát âm thanh thông báo tiếng Việt (TTS)
    let speakingMatchIdx = null;
    let speechSessionId = 0;
    let speechPauseTimer = null;
    let currentAudioObj = null;
    let preferredVoiceEngine = 'auto'; // 'auto' | 'online' | 'native'
    const ttsAudioCache = new Map();

    const ROUND_ORDER = [
      'Vòng bảng',
      'Tứ kết',
      'Bán kết',
      'Chung kết',
      'Tứ kết Seri B',
      'Bán kết Seri B',
      'Chung kết Seri B'
    ];

    // =========================================================================
    // KHỞI TẠO & ĐIỀU HƯỚNG URL
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      startClock();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
      }

      const urlParams = new URLSearchParams(window.location.search);
      const giaiParam = urlParams.get('giai');

      if (giaiParam) {
        selectTournament(giaiParam, false);
      } else {
        loadTournamentsList();
      }
    });

    window.addEventListener('popstate', () => {
      stopAnnouncement();
      closeTeamMatchesModal();
      const urlParams = new URLSearchParams(window.location.search);
      const giaiParam = urlParams.get('giai');
      if (giaiParam) {
        selectTournament(giaiParam, false);
      } else {
        showSelectorScreen();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (speakingMatchIdx !== null) stopAnnouncement();
        if (currentModalTeamId) closeTeamMatchesModal();
      }
    });

    window.addEventListener('beforeunload', () => {
      stopAnnouncement();
    });

    function startClock() {
      const update = () => {
        const now = new Date();
        document.getElementById('live-clock').textContent =
          now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      };
      update();
      setInterval(update, 1000);
    }

    function showSelectorScreen() {
      stopAnnouncement();
      closeTeamMatchesModal();
      if (refreshInterval) clearInterval(refreshInterval);
      currentMaGiaiDau = null;
      document.getElementById('scoreboard-screen').classList.add('hidden');
      document.getElementById('tournament-selector-screen').classList.remove('hidden');
      loadTournamentsList();
    }

    function backToSelector() {
      const url = new URL(window.location);
      url.searchParams.delete('giai');
      window.history.pushState({}, '', url);
      showSelectorScreen();
    }

    // =========================================================================
    // HỆ THỐNG PHÁT ÂM THANH TIẾNG VIỆT (TỰ ĐỘNG CHỌN GIỌNG VIỆT CHUẨN)
    // =========================================================================
    function getBestVietnameseNativeVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      const viVoices = voices.filter(v =>
        (v.lang && /^vi([-_]|$)/i.test(v.lang.trim())) ||
        (v.name && /(vietnam|tiếng việt|tieng viet|hoaimy|namminh)/i.test(v.name))
      );
      if (viVoices.length === 0) return null;

      return (
        viVoices.find(v => /google|natural|hoaimy|namminh|linh/i.test(v.name)) ||
        viVoices[0]
      );
    }

    function resolveVoiceEngine() {
      const nativeVi = getBestVietnameseNativeVoice();
      if (preferredVoiceEngine === 'online') return { type: 'online', voice: null };
      if (preferredVoiceEngine === 'native' && nativeVi) return { type: 'native', voice: nativeVi };
      // Mặc định 'auto': Chỉ dùng giọng thiết bị khi thực sự có giọng tiếng Việt; nếu không dùng Giọng Việt Online
      if (nativeVi) return { type: 'native', voice: nativeVi };
      return { type: 'online', voice: null };
    }

    function switchSpeechEngineMode() {
      const currentIdx = speakingMatchIdx;
      const nativeVi = getBestVietnameseNativeVoice();
      if (preferredVoiceEngine === 'online') {
        preferredVoiceEngine = nativeVi ? 'native' : 'online';
      } else {
        preferredVoiceEngine = 'online';
      }
      if (currentIdx !== null) {
        stopAnnouncement();
        toggleMatchAnnouncement(currentIdx);
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showAnnouncementPopup(match, segments, engineType) {
      const popup = document.getElementById('speech-announcement-popup');
      const subtitleEl = document.getElementById('speech-popup-subtitle');
      const bodyEl = document.getElementById('speech-popup-body');
      const engineBtn = document.getElementById('btn-toggle-voice-engine');
      if (!popup || !bodyEl) return;

      const subParts = [
        match.Vong,
        match.LuotTran,
        match.SanThiDau,
        match.MaTran ? `#${match.MaTran}` : ''
      ].filter(Boolean);
      subtitleEl.textContent = subParts.join(' • ');

      if (engineBtn) {
        engineBtn.textContent = engineType === 'online' ? 'Giọng Việt Online' : 'Giọng Việt Thiết bị';
      }

      bodyEl.innerHTML = segments.map((seg, idx) => {
        const displayText = seg.displayText !== undefined ? seg.displayText : seg.text;
        const baseWeight = seg.emphasis ? 'font-bold text-slate-900' : 'font-normal text-slate-700';
        return `<span data-seg-idx="${idx}" class="speech-seg transition-colors duration-150 rounded px-0.5 ${baseWeight}">${escapeHtml(displayText)}</span>`;
      }).join(' ');

      popup.classList.remove('hidden');
      bodyEl.scrollTop = 0;
    }

    function highlightActiveSpeechSegment(activeIdx) {
      const bodyEl = document.getElementById('speech-popup-body');
      if (!bodyEl) return;
      bodyEl.querySelectorAll('.speech-seg').forEach(span => {
        const idx = parseInt(span.getAttribute('data-seg-idx'), 10);
        if (idx === activeIdx) {
          span.classList.add('bg-sky-200/90', 'text-sky-950');
          const spanTop = span.offsetTop;
          const spanBottom = spanTop + span.offsetHeight;
          if (spanBottom > bodyEl.scrollTop + bodyEl.clientHeight || spanTop < bodyEl.scrollTop) {
            bodyEl.scrollTo({ top: Math.max(0, spanTop - 24), behavior: 'smooth' });
          }
        } else {
          span.classList.remove('bg-sky-200/90', 'text-sky-950');
        }
      });
    }

    function hideAnnouncementPopup() {
      const popup = document.getElementById('speech-announcement-popup');
      if (popup) popup.classList.add('hidden');
    }

    function updateSpeakerButtonsUI() {
      document.querySelectorAll('.btn-speaker-match').forEach(btn => {
        const idx = parseInt(btn.getAttribute('data-match-idx'), 10);
        const icon = btn.querySelector('i');
        if (speakingMatchIdx !== null && idx === speakingMatchIdx) {
          btn.classList.add('speaker-active');
          btn.title = 'Dừng phát thông báo';
          if (icon) icon.className = 'fa-solid fa-stop';
        } else {
          btn.classList.remove('speaker-active');
          btn.title = 'Phát loa thông báo trận đấu';
          if (icon) icon.className = 'fa-solid fa-volume-high';
        }
      });
    }

    function stopAnnouncement() {
      speechSessionId++;
      if (speechPauseTimer) {
        clearTimeout(speechPauseTimer);
        speechPauseTimer = null;
      }
      if (currentAudioObj) {
        try {
          currentAudioObj.pause();
          currentAudioObj.src = '';
        } catch (e) {}
        currentAudioObj = null;
      }
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }
      speakingMatchIdx = null;
      updateSpeakerButtonsUI();
      hideAnnouncementPopup();
    }

    function toggleMatchAnnouncement(matchIdx) {
      if (speakingMatchIdx === matchIdx) {
        stopAnnouncement();
        return;
      }

      const match = (tournamentData && tournamentData.matches) ? tournamentData.matches[matchIdx] : null;
      if (!match) return;

      stopAnnouncement();
      speakingMatchIdx = matchIdx;
      updateSpeakerButtonsUI();

      const engine = resolveVoiceEngine();
      const segments = buildMatchSpeechSegments(match);
      showAnnouncementPopup(match, segments, engine.type);

      if (engine.type === 'native' && engine.voice) {
        playNativeVietnameseSegments(segments, engine.voice, speechSessionId);
      } else {
        playOnlineVietnameseSegments(segments, speechSessionId);
      }
    }

    function formatPairSpeechPhrase(teamObj, fallbackNote = '') {
      if (!teamObj) {
        return (fallbackNote || '').trim() || 'đội chưa xác định';
      }
      const p1 = getPlayerDisplayName(teamObj.VDV1);
      const p2 = getPlayerDisplayName(teamObj.VDV2);
      if (p1 && p2) {
        return `cặp vận động viên ${p1} và ${p2}`;
      }
      if (p1) {
        return `vận động viên ${p1}`;
      }
      return (teamObj.TenDoi || fallbackNote || '').trim() || 'đội chưa xác định';
    }

    function formatCourtSpeechText(sanRaw) {
      const s = (sanRaw || '').trim();
      if (!s) return 'sân thi đấu';
      if (/^\d+$/.test(s)) return `Sân ${s}`;
      return s;
    }

    function buildMatchSpeechSegments(match) {
      const teamsMap = getTeamsMap();
      const team1 = teamsMap[match.MaDoiThu1];
      const team2 = teamsMap[match.MaDoiThu2];

      const status = (match.TrangThai || 'Chờ thi đấu').trim();
      const vongRaw = (match.Vong || '').trim();
      const isGroupStage = vongRaw.toLowerCase() === 'vòng bảng';
      const luotRaw = (match.LuotTran || '').trim();
      const sanText = formatCourtSpeechText(match.SanThiDau);

      const bangRaw = ((team1 && team1.BangThiDau) || (team2 && team2.BangThiDau) || '').trim();
      const bangText = bangRaw ? (/^bảng\b/i.test(bangRaw) ? bangRaw : `Bảng ${bangRaw}`) : '';

      const refName = (match.TenTrongTai || '').trim();

      // KỊCH BẢN 3 & 4: TRẬN ĐÃ THI ĐẤU
      if (status === 'Đã thi đấu') {
        const s1 = parseFloat(match.DiemTySoDoiThu1);
        const s2 = parseFloat(match.DiemTySoDoiThu2);
        const p1 = parseFloat(match.DiemDoiThu1);
        const p2 = parseFloat(match.DiemDoiThu2);

        let team1Won = true;
        if (!isNaN(s1) && !isNaN(s2) && s1 !== s2) {
          team1Won = s1 > s2;
        } else if (!isNaN(p1) && !isNaN(p2) && p1 !== p2) {
          team1Won = p1 > p2;
        }

        const winTeam = team1Won ? team1 : team2;
        const winFallback = team1Won ? match.GhiChu1 : match.GhiChu2;
        const loseTeam = team1Won ? team2 : team1;
        const loseFallback = team1Won ? match.GhiChu2 : match.GhiChu1;

        const winScore = team1Won ? (match.DiemTySoDoiThu1 || '0') : (match.DiemTySoDoiThu2 || '0');
        const loseScore = team1Won ? (match.DiemTySoDoiThu2 || '0') : (match.DiemTySoDoiThu1 || '0');

        const winPhrase = formatPairSpeechPhrase(winTeam, winFallback);
        const losePhrase = formatPairSpeechPhrase(loseTeam, loseFallback);

        const matchTitleParts = [vongRaw, luotRaw].filter(Boolean).join(', ');
        const matchTitleDisplay = [vongRaw, luotRaw].filter(Boolean).join(' - ');

        const segs = [
          { text: 'Ban tổ chức xin thông báo kết quả trận', pauseAfter: 120 },
          { text: matchTitleParts || 'thi đấu', displayText: matchTitleDisplay || 'thi đấu', emphasis: true, pauseAfter: 160 },
          { text: 'vừa kết thúc tại', pauseAfter: 120 },
          { text: sanText, emphasis: true, pauseAfter: isGroupStage && bangText ? 140 : 320 }
        ];

        if (isGroupStage && bangText) {
          segs.push({ text: 'thuộc', pauseAfter: 100 });
          segs.push({ text: `${bangText}:`, emphasis: true, pauseAfter: 320 });
        }

        segs.push(
          { text: 'Cặp vận động viên', pauseAfter: 100 },
          { text: winPhrase.replace(/^(cặp )?vận động viên\s+/i, ''), emphasis: true, pauseAfter: 200 },
          { text: 'đã giành chiến thắng trước', pauseAfter: 140 },
          { text: losePhrase, emphasis: true, pauseAfter: 200 },
          { text: 'với tỷ số chung cuộc là', pauseAfter: 180 },
          { text: `${winScore}`, displayText: `${winScore} –`, emphasis: true, pauseAfter: 220 },
          { text: `${loseScore}.`, emphasis: true, pauseAfter: 360 },
          { text: 'Xin chúc mừng các vận động viên.', pauseAfter: 0 }
        );

        return segs;
      }

      // KỊCH BẢN 1 & 2: CHUẨN BỊ THI ĐẤU, CHỜ THI ĐẤU, ĐANG THI ĐẤU
      const team1Phrase = formatPairSpeechPhrase(team1, match.GhiChu1);
      const team2Phrase = formatPairSpeechPhrase(team2, match.GhiChu2);

      const roundParts = [];
      if (vongRaw) roundParts.push(vongRaw);
      if (isGroupStage && bangText) roundParts.push(bangText);
      if (luotRaw) roundParts.push(luotRaw);

      const segs = [
        { text: 'Ban tổ chức xin thông báo!', pauseAfter: 340 },
        { text: 'Mời các vận động viên có tên sau đây khẩn trương di chuyển vào khu vực sân thi đấu để chuẩn bị cho trận đấu tiếp theo:', pauseAfter: 300 },
        { text: 'Tại', pauseAfter: 110 },
        { text: sanText, emphasis: true, pauseAfter: 150 },
        { text: 'sẽ diễn ra', pauseAfter: 120 },
        { text: `${roundParts.join(', ') || 'trận đấu tiếp theo'}.`, displayText: `${roundParts.join(' - ') || 'trận đấu tiếp theo'}.`, emphasis: true, pauseAfter: 340 },
        { text: 'Xin mời', pauseAfter: 110 },
        { text: team1Phrase, emphasis: true, pauseAfter: 200 },
        { text: 'thi đấu với', pauseAfter: 140 },
        { text: `${team2Phrase}.`, emphasis: true, pauseAfter: 360 }
      ];

      if (refName) {
        segs.push(
          { text: 'Trận đấu này sẽ do trọng tài', pauseAfter: 120 },
          { text: refName, emphasis: true, pauseAfter: 130 },
          { text: 'điều hành.', pauseAfter: 360 }
        );
      }

      segs.push(
        { text: 'Xin nhắc lại, xin mời', pauseAfter: 140 },
        { text: team1Phrase, emphasis: true, pauseAfter: 160 },
        { text: 'và', pauseAfter: 110 },
        { text: team2Phrase, emphasis: true, pauseAfter: 200 },
        { text: 'nhanh chóng có mặt tại', pauseAfter: 110 },
        { text: sanText, emphasis: true, pauseAfter: 160 },
        { text: 'để làm thủ tục thi đấu.', pauseAfter: 320 },
        { text: 'Xin cảm ơn.', pauseAfter: 0 }
      );

      return segs;
    }

    // Phát bằng giọng tiếng Việt có sẵn trên thiết bị
    function playNativeVietnameseSegments(segments, viVoice, sessionId) {
      let index = 0;

      const speakNext = () => {
        if (sessionId !== speechSessionId) return;
        if (index >= segments.length) {
          stopAnnouncement();
          return;
        }

        const currentIdx = index;
        const seg = segments[index++];
        highlightActiveSpeechSegment(currentIdx);

        const utterance = new SpeechSynthesisUtterance(seg.text);
        utterance.voice = viVoice;
        utterance.lang = viVoice.lang || 'vi-VN';

        utterance.rate = seg.emphasis ? 0.87 : 0.94;
        utterance.pitch = seg.emphasis ? 1.05 : 1.0;
        utterance.volume = 1.0;

        utterance.onend = () => {
          if (sessionId !== speechSessionId) return;
          if (seg.pauseAfter > 0) {
            speechPauseTimer = setTimeout(speakNext, seg.pauseAfter);
          } else {
            speakNext();
          }
        };

        utterance.onerror = () => {
          if (sessionId !== speechSessionId) return;
          // Nếu giọng thiết bị gặp lỗi, tự động chuyển sang Giọng Việt Online
          playOnlineVietnameseSegments(segments.slice(currentIdx), sessionId);
        };

        window.speechSynthesis.speak(utterance);
      };

      speakNext();
    }

    // Tải âm thanh MP3 giọng Việt chuẩn từ Apps Script (có cache & tải trước)
    async function fetchVietnameseAudioDataUrl(text) {
      const key = text.trim();
      if (ttsAudioCache.has(key)) {
        return ttsAudioCache.get(key);
      }
      const res = await fetch(`${GAS_WEB_APP_URL}?action=tts&text=${encodeURIComponent(key)}`);
      const json = await res.json();
      if (json.status !== 'success' || !json.audioBase64) {
        throw new Error(json.message || 'Lỗi tạo âm thanh');
      }
      const dataUrl = `data:${json.mimeType || 'audio/mpeg'};base64,${json.audioBase64}`;
      ttsAudioCache.set(key, dataUrl);
      return dataUrl;
    }

    // Phát tuần tự các đoạn bằng Giọng Việt Online (tải trước đoạn kế tiếp để đọc mượt)
    function playOnlineVietnameseSegments(segments, sessionId) {
      const engineBtn = document.getElementById('btn-toggle-voice-engine');
      if (engineBtn) engineBtn.textContent = 'Giọng Việt Online';

      let index = 0;

      const playNext = async () => {
        if (sessionId !== speechSessionId) return;
        if (index >= segments.length) {
          stopAnnouncement();
          return;
        }

        const currentIdx = index;
        const seg = segments[index++];
        highlightActiveSpeechSegment(currentIdx);

        // Tải trước câu tiếp theo song song để không bị trễ nhịp
        if (index < segments.length) {
          fetchVietnameseAudioDataUrl(segments[index].text).catch(() => {});
        }

        try {
          const dataUrl = await fetchVietnameseAudioDataUrl(seg.text);
          if (sessionId !== speechSessionId) return;

          const audio = new Audio(dataUrl);
          currentAudioObj = audio;
          audio.playbackRate = seg.emphasis ? 0.92 : 0.98;

          audio.onended = () => {
            if (sessionId !== speechSessionId) return;
            currentAudioObj = null;
            if (seg.pauseAfter > 0) {
              speechPauseTimer = setTimeout(playNext, seg.pauseAfter);
            } else {
              playNext();
            }
          };

          audio.onerror = () => {
            if (sessionId !== speechSessionId) return;
            playNext();
          };

          await audio.play();
        } catch (err) {
          console.error('Lỗi phát âm thanh tiếng Việt:', err);
          if (sessionId === speechSessionId) {
            stopAnnouncement();
          }
        }
      };

      playNext();
    }

    // MÀN HÌNH 2: LOAD & CẬP NHẬT DỮ LIỆU GIẢI ĐẤU (AUTO-SYNC MỖI 5 PHÚT)
    // =========================================================================
    async function selectTournament(maGiaiDau, pushUrl = true) {
      stopAnnouncement();
      currentMaGiaiDau = maGiaiDau;
      if (pushUrl) {
        const url = new URL(window.location);
        url.searchParams.set('giai', maGiaiDau);
        window.history.pushState({}, '', url);
      }

      document.getElementById('tournament-selector-screen').classList.add('hidden');
      document.getElementById('scoreboard-screen').classList.remove('hidden');
      document.getElementById('board-loading').classList.remove('hidden');
      document.getElementById('board-content').classList.add('hidden');

      await fetchTournamentData(true);

      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(() => fetchTournamentData(false), 5 * 60 * 1000);
    }

    function manualRefreshData() {
      fetchTournamentData(false);
    }

    async function fetchTournamentData(isInitial) {
      if (!currentMaGiaiDau || isFetching) return;
      isFetching = true;

      const refreshIcon = document.getElementById('refresh-icon');
      const refreshBtn = document.getElementById('btn-refresh-data');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');
      if (refreshBtn) refreshBtn.classList.add('opacity-75');

      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?action=getTournamentData&maGiaiDau=${encodeURIComponent(currentMaGiaiDau)}`);
        const json = await res.json();
        if (json.status !== 'success') throw new Error(json.message);

        if (json.data && Array.isArray(json.data.matches)) {
          json.data.matches.forEach((m, idx) => {
            m._idx = idx;
          });
        }

        const newDataStr = JSON.stringify(json.data);
        const oldDataStr = tournamentData ? JSON.stringify(tournamentData) : '';

        if (isInitial || newDataStr !== oldDataStr) {
          tournamentData = json.data;
          updateHeaderInfo();
          buildNavigationMenu(isInitial);

          if (isInitial) {
            document.getElementById('board-loading').classList.add('hidden');
            document.getElementById('board-content').classList.remove('hidden');
          }
          renderActiveTab();

          if (currentModalTeamId) {
            openTeamMatchesModal(currentModalTeamId);
          }
          updateSpeakerButtonsUI();
        }
      } catch (err) {
        console.error('Lỗi đồng bộ dữ liệu:', err);
        if (isInitial) {
          document.getElementById('board-loading').innerHTML =
            `<div class="text-red-600 font-bold text-xl">Không thể tải dữ liệu giải đấu: ${err.message}</div>`;
        }
      } finally {
        isFetching = false;
        if (refreshIcon) refreshIcon.classList.remove('animate-spin');
        if (refreshBtn) refreshBtn.classList.remove('opacity-75');
      }
    }

    function updateHeaderInfo() {
      const t = tournamentData.tournament || {};
      document.getElementById('header-tour-name').textContent = t.TenGiaiDau || currentMaGiaiDau;
      document.getElementById('header-tour-org').innerHTML = `<i class="fa-solid fa-building mr-1 text-emerald-400"></i> ${t.DonViToChuc || ''}`;
      document.getElementById('header-tour-date').innerHTML = `<i class="fa-regular fa-calendar mr-1 text-sky-400"></i> ${t.NgayThiDau || ''}`;
      document.title = `${t.TenGiaiDau || 'Pickleball'} - Live Scoreboard`;
    }

    function buildNavigationMenu(isInitial) {
      const matches = tournamentData.matches || [];
      const uniqueRounds = [...new Set(matches.map(m => m.Vong).filter(Boolean))];

      uniqueRounds.sort((a, b) => {
        const idxA = ROUND_ORDER.findIndex(r => r.toLowerCase() === a.trim().toLowerCase());
        const idxB = ROUND_ORDER.findIndex(r => r.toLowerCase() === b.trim().toLowerCase());
        if (idxA === -1 && idxB === -1) return a.localeCompare(b);
        if (idxA === -1) return 1;
        if (idxB === -1) return -1;
        return idxA - idxB;
      });

      const tabs = [...uniqueRounds, 'SO_DO', 'THANH_TICH'];

      if (isInitial || !tabs.includes(activeTab)) {
        activeTab = uniqueRounds.length > 0 ? uniqueRounds[0] : 'SO_DO';
      }

      const navEl = document.getElementById('rounds-nav');
      navEl.innerHTML = tabs.map(tab => {
        const isAch = tab === 'THANH_TICH';
        const isDiagram = tab === 'SO_DO';
        const isActive = activeTab === tab;

        let label = tab;
        if (isDiagram) {
          label = `<i class="fa-solid fa-diagram-project ${isActive ? 'text-slate-950' : 'text-sky-300'} mr-1"></i>Sơ đồ`;
        } else if (isAch) {
          label = `<i class="fa-solid fa-trophy ${isActive ? 'text-slate-950' : 'text-amber-400'} mr-1"></i>Thành tích`;
        }

        const activeClass = isActive
          ? 'bg-emerald-500 text-slate-950 font-extrabold shadow'
          : 'bg-white/10 hover:bg-white/20 text-white font-semibold';

        return `
          <button onclick="switchTab('${tab}')"
                  class="px-2.5 py-1.5 rounded-lg text-xs md:text-sm transition-all whitespace-nowrap cursor-pointer ${activeClass}">
            ${label}
          </button>
        `;
      }).join('');
    }

    function switchTab(tab) {
      activeTab = tab;
      buildNavigationMenu(false);
      renderActiveTab();
      updateSpeakerButtonsUI();
    }

    function renderActiveTab() {
      const container = document.getElementById('board-content');
      if (!activeTab) return;

      if (activeTab === 'THANH_TICH') {
        renderAchievementsView(container);
      } else if (activeTab === 'SO_DO') {
        renderBracketDiagramView(container);
      } else if (activeTab.toLowerCase() === 'vòng bảng') {
        renderGroupStageView(container);
      } else if (activeTab.toLowerCase().includes('chung kết')) {
        renderFinalRoundView(container, activeTab);
      } else {
        renderKnockoutRoundView(container, activeTab);
      }
    }

    // =========================================================================
    // POPUP: HIỂN THỊ TẤT CẢ TRẬN THI ĐẤU CỦA ĐỘI (TĂNG DẦN THEO THỜI GIAN)
    // =========================================================================
    function openTeamMatchesModal(maDoi) {
      if (!maDoi || !tournamentData) return;
      const teamsMap = getTeamsMap();
      const team = teamsMap[maDoi];
      if (!team) return;

      currentModalTeamId = maDoi;

      const p1 = getPlayerDisplayName(team.VDV1);
      const p2 = getPlayerDisplayName(team.VDV2);
      const displayNames = [p1, p2].filter(Boolean).join(' & ') || team.TenDoi || maDoi;

      document.getElementById('modal-team-title').textContent = displayNames;

      const subEl = document.getElementById('modal-team-subtitle');
      const teamLabel = (team.TenDoi || '').trim() || formatTeamCodeLabel(team);
      if (teamLabel && teamLabel !== displayNames) {
        subEl.textContent = teamLabel;
        subEl.classList.remove('hidden');
      } else {
        subEl.classList.add('hidden');
      }

      const grpEl = document.getElementById('modal-team-group');
      if (team.BangThiDau) {
        grpEl.textContent = `Bảng ${team.BangThiDau}`;
        grpEl.classList.remove('hidden');
      } else {
        grpEl.classList.add('hidden');
      }

      const teamMatches = (tournamentData.matches || [])
        .filter(m => m.MaDoiThu1 === maDoi || m.MaDoiThu2 === maDoi)
        .sort((a, b) => {
          const tA = parseVNDateTime(a.NgayGioThiDau);
          const tB = parseVNDateTime(b.NgayGioThiDau);
          if (tA !== tB) {
            if (tA === 0) return 1;
            if (tB === 0) return -1;
            return tA - tB;
          }
          const rA = ROUND_ORDER.findIndex(r => r.toLowerCase() === (a.Vong || '').trim().toLowerCase());
          const rB = ROUND_ORDER.findIndex(r => r.toLowerCase() === (b.Vong || '').trim().toLowerCase());
          if (rA !== rB) return (rA === -1 ? 99 : rA) - (rB === -1 ? 99 : rB);
          return parseLuotNumber(a.LuotTran) - parseLuotNumber(b.LuotTran);
        });

      document.getElementById('modal-team-count').textContent = `${teamMatches.length} trận đấu`;

      const listEl = document.getElementById('modal-team-matches-list');
      listEl.innerHTML = teamMatches.length
        ? teamMatches.map(m => renderMatchCard(m, teamsMap, false, (m.Vong || '').trim().toLowerCase() === 'vòng bảng', true)).join('')
        : '<div class="text-center text-slate-400 py-12 text-lg font-semibold">Đội này chưa có trận thi đấu nào trong giải</div>';

      document.getElementById('team-matches-modal').classList.remove('hidden');
      updateSpeakerButtonsUI();
    }

    function closeTeamMatchesModal() {
      currentModalTeamId = null;
      document.getElementById('team-matches-modal').classList.add('hidden');
    }

    function handleModalBackdropClick(event) {
      if (event.target && event.target.id === 'team-matches-modal') {
        closeTeamMatchesModal();
      }

    // =========================================================================
    // HELPERS: CHUẨN HÓA CHUỖI, ÁNH XẠ MÃ TRẬN (TK1 -> TỨ KẾT 1), THỜI GIAN
    // =========================================================================
    function getTeamsMap() {
      const map = {};
      (tournamentData.teams || []).forEach(t => {
        map[t.MaDoi] = t;
      });
      return map;
    }

    function formatTeamCodeLabel(teamObj) {
      if (!teamObj) return '';
      const rawCode = (teamObj.MaDoi || '').trim();
      if (!rawCode) return (teamObj.TenDoi || '').trim();
      return /^đội\b/i.test(rawCode) ? rawCode : `Đội ${rawCode}`;
    }

    function getPlayerDisplayName(vdvObj) {
      if (!vdvObj) return '';
      const nick = (vdvObj.BietDanh || '').trim();
      const full = (vdvObj.HoTen || '').trim();
      return nick || full;
    }

    function escapeAttr(str) {
      return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function normalizeViText(str) {
      return String(str || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd')
        .replace(/Đ/g, 'D')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, ' ')
        .trim()
        .replace(/\b0+(\d+)\b/g, '$1');
    }

    function getMatchAliases(match) {
      const aliases = new Set();
      const normCode = normalizeViText(match.MaTran);
      const normRound = normalizeViText(match.Vong);

      if (normCode) {
        aliases.add(normCode);
        aliases.add(normCode.replace(/\s+/g, ''));
      }

      const codeParts = normCode.match(/^([a-z\s]+?)\s*(\d+)$/);
      if (codeParts) {
        const prefix = codeParts[1].replace(/\s+/g, '');
        const num = codeParts[2];

        aliases.add(`${prefix}${num}`);
        aliases.add(`${prefix} ${num}`);

        if (prefix === 'tk') aliases.add(`tu ket ${num}`);
        if (prefix === 'bk') aliases.add(`ban ket ${num}`);
        if (prefix === 'ck') aliases.add(`chung ket ${num}`);

        if (prefix === 'tkb') {
          aliases.add(`tu ket seri b ${num}`);
          aliases.add(`tu ket ${num} seri b`);
          aliases.add(`tu ket ${num}`);
        }
        if (prefix === 'bkb') {
          aliases.add(`ban ket seri b ${num}`);
          aliases.add(`ban ket ${num} seri b`);
          aliases.add(`ban ket ${num}`);
        }
        if (prefix === 'ckb') {
          aliases.add(`chung ket seri b ${num}`);
          aliases.add(`chung ket ${num} seri b`);
          aliases.add(`chung ket ${num}`);
        }

        if (normRound) {
          aliases.add(`${normRound} ${num}`);
          if (normRound.includes('seri b')) {
            const baseRound = normRound.replace('seri b', '').trim();
            aliases.add(`${baseRound} ${num}`);
            aliases.add(`${baseRound} ${num} seri b`);
          }
        }
      }

      return [...aliases].filter(Boolean);
    }

    function findSourceMatchIndex(noteText, targetTeamId, srcMatches) {
      const normNote = normalizeViText(noteText);
      if (normNote) {
        const paddedNote = ` ${normNote} `;
        for (let i = 0; i < srcMatches.length; i++) {
          const aliases = getMatchAliases(srcMatches[i]);
          for (const alias of aliases) {
            if (paddedNote.includes(` ${alias} `)) {
              return i;
            }
          }
        }
      }

      if (targetTeamId) {
        for (let i = 0; i < srcMatches.length; i++) {
          if (srcMatches[i].MaDoiThu1 === targetTeamId || srcMatches[i].MaDoiThu2 === targetTeamId) {
            return i;
          }
        }
      }

      return -1;
    }

    function getTeamPlayersDisplay(teamObj, fallbackNote = '') {
      if (!teamObj) {
        const text = (fallbackNote || '').trim() || 'Chờ kết quả';
        return `<span class="italic text-slate-500 font-semibold break-words whitespace-normal">${text}</span>`;
      }
      const p1 = getPlayerDisplayName(teamObj.VDV1);
      const p2 = getPlayerDisplayName(teamObj.VDV2);
      const clickAttr = teamObj.MaDoi
        ? `onclick="openTeamMatchesModal('${escapeAttr(teamObj.MaDoi)}')" title="Xem tất cả trận của đội này"`
        : '';
      const hoverClass = teamObj.MaDoi
        ? 'cursor-pointer hover:underline decoration-2 underline-offset-2 transition'
        : '';

      if (!p1 && !p2) {
        const text = (teamObj.TenDoi || fallbackNote || '').trim() || 'Chờ kết quả';
        return `<span ${clickAttr} class="font-bold break-words whitespace-normal ${hoverClass}">${text}</span>`;
      }
      return `
        <div ${clickAttr} class="leading-snug space-y-0.5 break-words whitespace-normal ${hoverClass}">
          <div>${p1}</div>
          ${p2 ? `<div>${p2}</div>` : ''}
        </div>
      `;
    }

    function parseVNDateTime(str) {
      if (!str) return 0;
      const parts = str.trim().split(/\s+/);
      const dateParts = parts[0].split('/');
      if (dateParts.length < 3) return 0;
      const day = parseInt(dateParts[0], 10);
      const month = parseInt(dateParts[1], 10) - 1;
      const year = parseInt(dateParts[2], 10);
      let hour = 0, min = 0, sec = 0;
      if (parts[1]) {
        const timeParts = parts[1].split(':');
        hour = parseInt(timeParts[0], 10) || 0;
        min = parseInt(timeParts[1], 10) || 0;
        sec = parseInt(timeParts[2], 10) || 0;
      }
      return new Date(year, month, day, hour, min, sec).getTime();
    }

    function extractTimeOnly(str) {
      if (!str) return '';
      const parts = str.trim().split(/\s+/);
      if (parts.length >= 2) {
        return parts[1].split(':').slice(0, 2).join(':');
      }
      return str.trim();
    }

    function parseLuotNumber(luotStr) {
      if (!luotStr) return 0;
      const match = String(luotStr).match(/\d+/);
      return match ? parseInt(match[0], 10) : 0;
    }

    function getHeadToHeadResult(teamAId, teamBId, groupMatches) {
      let winsA = 0;
      let winsB = 0;

      groupMatches.forEach(m => {
        if ((m.TrangThai || '').trim() !== 'Đã thi đấu') return;
        const isA1B2 = m.MaDoiThu1 === teamAId && m.MaDoiThu2 === teamBId;
        const isB1A2 = m.MaDoiThu1 === teamBId && m.MaDoiThu2 === teamAId;
        if (!isA1B2 && !isB1A2) return;

        const ptsA = parseFloat(isA1B2 ? m.DiemDoiThu1 : m.DiemDoiThu2);
        const ptsB = parseFloat(isA1B2 ? m.DiemDoiThu2 : m.DiemDoiThu1);
        if (!isNaN(ptsA) && !isNaN(ptsB) && ptsA !== ptsB) {
          if (ptsA > ptsB) winsA++;
          else winsB++;
          return;
        }

        const scoreA = parseFloat(isA1B2 ? m.DiemTySoDoiThu1 : m.DiemTySoDoiThu2);
        const scoreB = parseFloat(isA1B2 ? m.DiemTySoDoiThu2 : m.DiemTySoDoiThu1);
        if (!isNaN(scoreA) && !isNaN(scoreB) && scoreA !== scoreB) {
          if (scoreA > scoreB) winsA++;
          else winsB++;
          return;
        }

        const diffA = parseFloat(isA1B2 ? m.HieuSoDoiThu1 : m.HieuSoDoiThu2);
        const diffB = parseFloat(isA1B2 ? m.HieuSoDoiThu2 : m.HieuSoDoiThu1);
        if (!isNaN(diffA) && !isNaN(diffB) && diffA !== diffB) {
          if (diffA > diffB) winsA++;
          else winsB++;
        }
      });

      if (winsA > winsB) return 1;
      if (winsB > winsA) return -1;
      return 0;
    }

    // =========================================================================
    // COMPONENT: THẺ TRẬN ĐẤU (CÓ NÚT LOA PHÁT THÔNG BÁO)
    // =========================================================================
    function renderMatchCard(match, teamsMap, isLargeFinal = false, isGroupStage = false, showRoundBadge = false) {
      const team1 = teamsMap[match.MaDoiThu1];
      const team2 = teamsMap[match.MaDoiThu2];
      const status = (match.TrangThai || 'Chờ thi đấu').trim();

      const isFinished = status === 'Đã thi đấu';
      const isLive = status === 'Đang thi đấu';
      const isReady = status === 'Chuẩn bị thi đấu';

      const bangThiDau = (team1 && team1.BangThiDau) || (team2 && team2.BangThiDau) || '';
      const timeDisplay = extractTimeOnly(match.NgayGioThiDau);

      let cardClass = 'match-waiting';
      let badgeClass = 'bg-slate-200 text-slate-700';
      if (isLive) {
        cardClass = 'match-live shadow-md';
        badgeClass = 'bg-emerald-600 text-white animate-pulse';
      } else if (isReady) {
        cardClass = 'match-ready shadow-sm';
        badgeClass = 'bg-amber-500 text-slate-950 font-extrabold';
      } else if (isFinished) {
        cardClass = 'match-finished';
        badgeClass = 'bg-sky-100 text-sky-800';
      }

      const rawS1 = match.DiemTySoDoiThu1;
      const rawS2 = match.DiemTySoDoiThu2;
      const hasScore = rawS1 !== '' || rawS2 !== '';
      const numS1 = parseFloat(rawS1);
      const numS2 = parseFloat(rawS2);

      let t1Win = false, t2Win = false;
      if (hasScore && !isNaN(numS1) && !isNaN(numS2)) {
        if (numS1 > numS2) t1Win = true;
        else if (numS2 > numS1) t2Win = true;
      }

      const t1Color = t1Win ? 'text-emerald-700 font-black' : 'text-slate-800 font-bold';
      const t2Color = t2Win ? 'text-emerald-700 font-black' : 'text-slate-800 font-bold';
      const s1Color = t1Win ? 'text-emerald-600' : 'text-slate-800';
      const s2Color = t2Win ? 'text-emerald-600' : 'text-slate-800';

      const diff1 = (isGroupStage && match.HieuSoDoiThu1 !== '')
        ? `(${Number(match.HieuSoDoiThu1) > 0 ? '+' : ''}${match.HieuSoDoiThu1})`
        : '';
      const diff2 = (isGroupStage && match.HieuSoDoiThu2 !== '')
        ? `(${Number(match.HieuSoDoiThu2) > 0 ? '+' : ''}${match.HieuSoDoiThu2})`
        : '';

      const showScore = isFinished || isLive || hasScore;
      const score1Display = showScore && rawS1 !== '' ? rawS1 : '';
      const score2Display = showScore && rawS2 !== '' ? rawS2 : '';

      const padClass = isLargeFinal ? 'p-8 rounded-3xl' : 'p-3.5 rounded-xl';
      const nameSize = isLargeFinal ? 'text-2xl md:text-3xl' : 'text-sm md:text-base';
      const scoreSize = isLargeFinal ? 'text-5xl md:text-6xl' : 'text-2xl md:text-3xl';

      const matchIdx = match._idx !== undefined ? match._idx : -1;
      const isSpeaking = speakingMatchIdx !== null && speakingMatchIdx === matchIdx;
      const speakerBtnSize = isLargeFinal ? 'w-10 h-10 text-base' : 'w-7 h-7 text-xs';

      return `
        <div class="${cardClass} ${padClass} transition-all flex flex-col justify-between">
          <!-- Hàng trên: Trạng thái, Vòng, Bảng, Lượt trận - Sân/Giờ/Trọng tài - Nút Loa & Mã trận -->
          <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5 pb-1.5 border-b border-black/10 text-xs">
            <div class="flex flex-wrap items-center gap-1.5 shrink-0">
              <span class="px-2.5 py-0.5 rounded-md font-bold uppercase tracking-wide ${badgeClass}">
                ${isLive ? '<i class="fa-solid fa-circle text-[8px] mr-1"></i>' : ''}${status}
              </span>
              ${showRoundBadge && match.Vong ? `<span class="px-2 py-0.5 rounded-md font-extrabold bg-slate-800 text-white">${match.Vong}</span>` : ''}
              ${isGroupStage && bangThiDau ? `<span class="px-2 py-0.5 rounded-md font-extrabold bg-sky-700 text-white">Bảng ${bangThiDau}</span>` : ''}
              ${match.LuotTran ? `<span class="px-2 py-0.5 rounded-md font-bold bg-indigo-100 text-indigo-800 border border-indigo-200">${match.LuotTran}</span>` : ''}
            </div>

            <div class="flex flex-wrap items-center justify-center gap-2.5 text-slate-600 font-semibold ${isLargeFinal ? 'text-base' : 'text-xs'}">
              ${match.SanThiDau ? `<span class="bg-white/80 px-2 py-0.5 rounded border border-slate-200 text-sky-800 font-bold"><i class="fa-solid fa-location-dot mr-1 text-red-500"></i>${match.SanThiDau}</span>` : ''}
              ${timeDisplay ? `<span><i class="fa-regular fa-clock mr-1"></i>${timeDisplay}</span>` : ''}
              ${match.TenTrongTai ? `<span><i class="fa-solid fa-user-tie mr-1"></i>TT: ${match.TenTrongTai}</span>` : ''}
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
              <button type="button"
                      data-match-idx="${matchIdx}"
                      onclick="event.stopPropagation(); toggleMatchAnnouncement(${matchIdx})"
                      title="${isSpeaking ? 'Dừng phát thông báo' : 'Phát loa thông báo trận đấu'}"
                      class="btn-speaker-match ${speakerBtnSize} ${isSpeaking ? 'speaker-active' : ''} rounded-full bg-white hover:bg-sky-600 text-sky-700 hover:text-white border border-sky-300 shadow-sm flex items-center justify-center transition cursor-pointer">
                <i class="fa-solid ${isSpeaking ? 'fa-stop' : 'fa-volume-high'}"></i>
              </button>
              <span class="text-[11px] font-mono font-bold text-slate-400 bg-black/5 px-2 py-0.5 rounded">
                #${match.MaTran || ''}
              </span>
            </div>
          </div>

          <!-- Hàng chính: Đội 1 (Trái) - Tỷ số (Giữa) - Đội 2 (Phải) -->
          <div class="grid grid-cols-12 items-center gap-2">
            <div class="col-span-5 text-left min-w-0 ${nameSize} ${t1Color}">
              ${getTeamPlayersDisplay(team1, match.GhiChu1)}

            <div class="col-span-2 flex items-center justify-center gap-1.5 bg-white/90 rounded-xl py-1.5 px-1.5 shadow-inner border border-slate-200/80 shrink-0">
              <div class="text-center min-w-[24px]">
                <div class="${scoreSize} font-black leading-none ${s1Color}">${score1Display}</div>
                ${showScore && diff1 ? `<div class="text-[11px] font-bold text-slate-500 mt-1">${diff1}</div>` : ''}
              </div>
              <div class="text-slate-400 font-black text-base">:</div>
              <div class="text-center min-w-[24px]">
                <div class="${scoreSize} font-black leading-none ${s2Color}">${score2Display}</div>
                ${showScore && diff2 ? `<div class="text-[11px] font-bold text-slate-500 mt-1">${diff2}</div>` : ''}
              </div>
            </div>

            <div class="col-span-5 text-right min-w-0 ${nameSize} ${t2Color}">
              ${getTeamPlayersDisplay(team2, match.GhiChu2)}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 1: VÒNG BẢNG
    // =========================================================================
    function renderGroupStageView(container) {
      const teams = tournamentData.teams || [];
      const groupMatches = (tournamentData.matches || []).filter(m => m.Vong && m.Vong.toLowerCase() === 'vòng bảng');
      const teamsMap = getTeamsMap();

      const statsMap = {};
      teams.forEach(t => {
        statsMap[t.MaDoi] = {
          team: t,
          played: 0,
          totalMatches: 0,
          points: 0,
          diff: 0,
          h2hNotes: []
        };
      });

      groupMatches.forEach(m => {
        const isDone = (m.TrangThai || '').trim() === 'Đã thi đấu';
        if (statsMap[m.MaDoiThu1]) {
          statsMap[m.MaDoiThu1].totalMatches += 1;
          if (isDone) {
            statsMap[m.MaDoiThu1].played += 1;
            statsMap[m.MaDoiThu1].points += parseFloat(m.DiemDoiThu1) || 0;
            statsMap[m.MaDoiThu1].diff += parseFloat(m.HieuSoDoiThu1) || 0;
          }
        }
        if (statsMap[m.MaDoiThu2]) {
          statsMap[m.MaDoiThu2].totalMatches += 1;
          if (isDone) {
            statsMap[m.MaDoiThu2].played += 1;
            statsMap[m.MaDoiThu2].points += parseFloat(m.DiemDoiThu2) || 0;
            statsMap[m.MaDoiThu2].diff += parseFloat(m.HieuSoDoiThu2) || 0;
          }
        }
      });

      const groups = {};
      Object.values(statsMap).forEach(item => {
        const grpName = item.team.BangThiDau || 'Khác';
        if (!groups[grpName]) groups[grpName] = [];
        groups[grpName].push(item);
      });

      const sortedGroupNames = Object.keys(groups).sort((a, b) => a.localeCompare(b));

      sortedGroupNames.forEach(gName => {
        const grpList = groups[gName];
        grpList.sort((a, b) => {
          if (b.points !== a.points) return b.points - a.points;
          if (b.diff !== a.diff) return b.diff - a.diff;
          const h2h = getHeadToHeadResult(a.team.MaDoi, b.team.MaDoi, groupMatches);
          if (h2h === 1) return -1;
          if (h2h === -1) return 1;
          return 0;
        });

        for (let i = 0; i < grpList.length; i++) {
          for (let j = i + 1; j < grpList.length; j++) {
            if (grpList[i].points === grpList[j].points && grpList[i].diff === grpList[j].diff) {
              const h2h = getHeadToHeadResult(grpList[i].team.MaDoi, grpList[j].team.MaDoi, groupMatches);
              const labelUpper = formatTeamCodeLabel(grpList[i].team);
              const labelLower = formatTeamCodeLabel(grpList[j].team);

                grpList[i].h2hNotes.push({

                  text: `Thắng trận đối đầu với ${labelLower}`

                grpList[j].h2hNotes.push({
                  type: 'lose',
                  text: `Thua trận đối đầu với ${labelUpper}`

          }
        }
      });

      const gridColsClass = sortedGroupNames.length >= 3 ? 'grid-cols-1 xl:grid-cols-2' : 'grid-cols-1';

      const groupsHtml = sortedGroupNames.map(gName => {

        return `

                  <th class="py-2 px-2">Vận động viên</th>

                  <th class="py-2 px-2 text-center w-14">HS</th>

              </thead>
              <tbody>
                ${thirdPlaceTeams.map((st, idx) => {
                  const isTop2 = idx < 2;
                  const rowBg = isTop2 ? 'bg-emerald-100/90 hover:bg-emerald-200/80 font-semibold' : 'bg-white hover:bg-slate-50';
                  const badgeRank = isTop2
                    ? `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-600 text-white text-xs font-black">${idx + 1}</span>`
                    : `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-200 text-slate-700 text-xs font-bold">${idx + 1}</span>`;
                  const teamCodeLabel = formatTeamCodeLabel(st.team);
                  const p1 = getPlayerDisplayName(st.team.VDV1);

                  const teamClickAttr = st.team.MaDoi
                    ? `onclick="openTeamMatchesModal('${escapeAttr(st.team.MaDoi)}')" title="Xem tất cả trận của đội này"`

                  return `

                      <td ${teamClickAttr} class="py-2 px-2 align-middle break-words whitespace-normal cursor-pointer group">
                        ${teamCodeLabel ? `<div class="mb-0.5"><span class="inline-block text-[11px] font-extrabold text-sky-800 bg-sky-100 border border-sky-200 px-1.5 py-0.2 rounded">${teamCodeLabel}</span></div>` : ''}
                        <div class="text-slate-900 group-hover:text-sky-700 group-hover:underline font-bold text-sm leading-snug">${p1}</div>

                      </td>
